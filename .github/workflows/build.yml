name: Build Native WebView2 EXE

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'שם התוכנה'
        required: true
        default: 'כספת טקסט וקבצים'
        type: string
      app_version:
        description: 'גרסת התוכנה'
        required: true
        default: '1.0.0'
        type: string

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pre-flight Checks
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          if (-not (Test-Path "index.html")) {
            Write-Error "שגיאה קריטית: קובץ ה-index.html לא נמצא!"
            exit 1
          }
          if (Test-Path "favicon.png") {
            npx --yes png-to-ico favicon.png > icon.ico
          }

      - name: Build Standalone WebView2 EXE
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> יוצר פרויקט C# מותאם אישית לשימוש ב-WebView2 המובנה של Windows..."

          # יצירת אפליקציית Windows Forms חדשה ב-C#
          dotnet new winforms -n VaultApp -o . --force
          
          # הוספת חבילת ה-WebView2 הרשמית של מיקרוסופט
          dotnet add package Microsoft.Web.WebView2

          # החלפת קוד ה-C# המרכזי כך שיטען ישירות את ה-index.html המקומי באמצעות WebView2
          $formCode = @"
          using System;
          using System.IO;
          using System.Windows.Forms;
          using Microsoft.Web.WebView2.Core;

          namespace VaultApp
          {
              public partial class MainForm : Form
              {
                  private Microsoft.Web.WebView2.WinForms.WebView2 webView;

                  public MainForm()
                  {
                      this.Text = "${{ github.event.inputs.app_name }}";
                      this.Width = 1024;
                      this.Height = 768;
                      this.StartPosition = FormStartPosition.CenterScreen;
                      
                      webView = new Microsoft.Web.WebView2.WinForms.WebView2();
                      webView.Dock = DockStyle.Fill;
                      this.Controls.Add(webView);
                      
                      InitializeAsync();
                  }

                  private async void InitializeAsync()
                  {
                      await webView.EnsureCoreWebView2Async(null);
                      string indexPath = Path.Combine(AppDomain.CurrentDomain.BaseDirectory, "index.html");
                      webView.CoreWebView2.Navigate(indexPath);
                  }
              }
          }
          "@

          Set-Content -Path "Program.cs" -Value $formCode -Encoding UTF8

          # העתקת קובץ האתר והאייקון לתיקיית הפלט של הקומפילציה
          Write-Host ">>> מהדק ומקמפל את קובץ ה-EXE..."
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

          # יצירת תיקיית הפצה נקייה
          New-Item -ItemType Directory -Force -Path "publish_output"
          Copy-Item "bin\Release\net8.0-windows\win-x64\publish\*.exe" "publish_output/"
          Copy-Item "index.html" "publish_output/"
          if (Test-Path "icon.ico") { Copy-Item "icon.ico" "publish_output/" }

          Write-Host "OK: קובץ ה-EXE נוצר בהצלחה!"

      - name: Compress to ZIP
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          & "7z" a -tzip -mx=9 "WebView2-Native-EXE.zip" "publish_output/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Native-WebView2-EXE
          path: WebView2-Native-EXE.zip
          retention-days: 7
