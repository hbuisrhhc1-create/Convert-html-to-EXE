name: Build Minimal Vault EXE

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'שם התוכנה'
        required: true
        default: 'כספת טקסט וקבצים'
        type: string
      app_version:
        description: 'גרסת התוכנה'
        required: true
        default: '1.0.0'
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean disk space & Pre-flight
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> מנקה סביבה ובודק קבצים מקדימים..."
          
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "output") { Remove-Item -Recurse -Force "output" }

          if (-not (Test-Path "index.html")) {
            Write-Error "שגיאה קריטית: קובץ ה-index.html לא נמצא!"
            exit 1
          }
          Write-Host "אישור: קובץ index.html נמצא בהצלחה."

          if (Test-Path "favicon.png") {
            npx --yes png-to-ico favicon.png > icon.ico
            Write-Host "אישור: אייקון האתר הומר בהצלחה."
          }

      - name: Build EXE with Nativefier
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> מתחיל בתהליך יצירת קובץ ה-EXE באמצעות Nativefier..."

          $appName = "${{ github.event.inputs.app_name }}"
          $appVersion = "${{ github.event.inputs.app_version }}"
          $hasIcon = Test-Path "icon.ico"

          $argsList = @(
            "--name", $appName,
            "--app-version", $appVersion,
            "--single-instance",
            "--disable-gpu-sandbox",
            "--tray", "false",
            "--platform", "windows",
            "--arch", "x64"
          )
          
          if ($hasIcon) {
            $argsList += "--icon"
            $argsList += "icon.ico"
          }

          npm install -g nativefier
          nativefier @argsList "index.html" "./dist"
          Write-Host ">>> בניית קובץ ה-EXE הסתיימה בהצלחה."

      - name: Purge Unwanted Locales & Compress
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> מנקה קבצי שפה מיותרים ודוחס את החבילה..."

          $targetDir = (Get-ChildItem -Path "dist" -Directory | Select-Object -First 1).FullName
          
          if ($targetDir) {
            # מחיקת שפות זרות מתיקיית ה-locales והשארת en-US בלבד
            $localesDir = Join-Path $targetDir "locales"
            if (Test-Path $localesDir) {
              Get-ChildItem -Path $localesDir -Exclude "en-US.pak" | Remove-Item -Force -Recurse
              Write-Host "OK: קבצי השפה המיותרים נמחקו בהצלחה."
            }

            # הסרת קבצי טקסט ורישיונות מיותרים
            Get-ChildItem -Path $targetDir -Filter "*.txt" | Remove-Item -Force -ErrorAction SilentlyContinue

            Write-Host ">>> דוחס את התיקייה ל-ZIP קליל ומהיר באמצעות 7-Zip..."
            & "7z" a -tzip Release-Vault.zip "$targetDir/*"
            Write-Host "OK: האריזה הסתיימה בהצלחה רבה!"
          } else {
            Write-Error "שגיאה: תיקיית היעד לא נמצאה."
            exit 1
          }

      - name: Upload EXE Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: Vault-EXE-Package
          path: Release-Vault.zip
          retention-days: 7
