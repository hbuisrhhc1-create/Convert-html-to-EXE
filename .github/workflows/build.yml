name: Universal Dynamic App Builder & Signer

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'אופציה 1: כתובת אתר מלאה (למשל https://example.com) - השאר ריק כדי להשתמש בקובץ מקומי'
        required: false
        default: ''
        type: string
      local_html_file:
        description: 'אופציה 2: קובץ HTML מקומי (רלוונטי אם כתובת האתר ריקה)'
        required: false
        default: '.html'
        type: string
      app_name:
        description: 'שם התוכנה'
        required: true
        default: ''
        type: string
      app_version:
        description: 'גרסת התוכנה (למשל 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      include_assets:
        description: 'האם לארוז ב-ZIP במידה ויש קבצים מרובים'
        required: true
        default: false
        type: boolean

jobs:
  build-universal:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-flight & Validate Assets
        shell: pwsh
        id: config
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          $url = "${{ github.event.inputs.website_url }}".Trim()
          $local = "${{ github.event.inputs.local_html_file }}".Trim()
          
          if (-not [string]::IsNullOrWhiteSpace($url)) {
            $source = $url
            Write-Host ">>> מצב נבחר: כתובת אתר אינטרנט ($source)"
          } else {
            $source = $local
            Write-Host ">>> מצב נבחר: קובץ מקומי ($source)"
            if (-not (Test-Path $source)) {
              Write-Error "שגיאה קריטית: הקובץ המקומי '$source' לא נמצא בפרויקט!"
              exit 1
            }
          }
          
          echo "FINAL_SOURCE=$source" >> $env:GITHUB_ENV

          # 1. בדיקת קיומם של קובצי תמונה מקומיים ב-Repository
          $iconSource = $null
          if (Test-Path "favicon.png") { $iconSource = "favicon.png" }
          elseif (Test-Path "icon.png") { $iconSource = "icon.png" }

          # 2. חילוץ חכם של אייקון מהאתר
          if (-not $iconSource -and -not (Test-Path "favicon.ico") -and (-not [string]::IsNullOrWhiteSpace($url))) {
            try {
              Write-Host ">>> מנסה לחלץ תגית favicon מתוך קוד ה-HTML של האתר..."
              $resp = Invoke-WebRequest -Uri $url -UserAgent "Mozilla/5.0" -UseBasicParsing
              $html = $resp.Content
              
              $regex = '<link\s+[^>]*rel=["''](?:shortcut\s+)?(?:apple-touch-)?icon["''][^>]*href=["'']([^"'']+)["'']'
              $match = [regex]::Match($html, $regex, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
              if (-not $match.Success) {
                $regexReverse = '<link\s+[^>]*href=["'']([^"'']+)["''][^>]*rel=["''](?:shortcut\s+)?(?:apple-touch-)?icon["'']'
                $match = [regex]::Match($html, $regexReverse, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
              }

              if ($match.Success) {
                $rawPath = $match.Groups[1].Value
                $baseUri = [System.Uri]$url
                $iconUrl = [System.Uri]::new($baseUri, $rawPath).AbsoluteUri
                Write-Host ">>> מוריד אייקון שנמצא ב-HTML: $iconUrl"
                Invoke-WebRequest -Uri $iconUrl -OutFile "remote_favicon.png" -UserAgent "Mozilla/5.0"
                if (Test-Path "remote_favicon.png") { $iconSource = "remote_favicon.png" }
              }
            } catch {
              Write-Host ">>> חילוץ מתגיות ה-HTML נכשל, עובר לשירות האייקונים..."
            }

            if (-not $iconSource) {
              try {
                $domain = ([System.Uri]$url).Host
                $faviconApi = "https://www.google.com/s2/favicons?domain=$domain&sz=128"
                Write-Host ">>> מוריד אייקון ברזולוציה גבוהה עבור הדומיין: $domain"
                Invoke-WebRequest -Uri $faviconApi -OutFile "remote_favicon.png" -UserAgent "Mozilla/5.0"
                if (Test-Path "remote_favicon.png") { $iconSource = "remote_favicon.png" }
              } catch {
                Write-Host ">>> לא ניתן היה להוריד אייקון מהאתר."
              }
            }
          }

          # 3. המרת קובץ התמונה ל-icon.ico
          if (Test-Path "favicon.ico") {
            Copy-Item "favicon.ico" "icon.ico" -Force
          } elseif ($iconSource) {
            Write-Host ">>> ממיר את הקובץ '$iconSource' ל-icon.ico..."
            cmd.exe /c "npx --yes png-to-ico $iconSource > icon.ico"
          }

      - name: Compile Standalone GUI WebView2 EXE
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> יוצר פרויקט C#..."

          dotnet new winforms -n UniversalAppProject -o . --force
          dotnet add package Microsoft.Web.WebView2

          $appVersion = "${{ github.event.inputs.app_version }}"
          $appName = "${{ github.event.inputs.app_name }}"

          $csproj = Get-Content UniversalAppProject.csproj -Raw
          
          if ($csproj -match '<OutputType>Exe</OutputType>') {
              $csproj = $csproj -replace '<OutputType>Exe</OutputType>', '<OutputType>WinExe</OutputType>'
          } else {
              $csproj = $csproj -replace '</PropertyGroup>', "<OutputType>WinExe</OutputType>`n  </PropertyGroup>"
          }

          $versionProps = @"
            <Version>$appVersion</Version>
            <AssemblyVersion>$appVersion</AssemblyVersion>
            <FileVersion>$appVersion</FileVersion>
            <Product>$appName</Product>
            <Company>ינון דרייב</Company>
          "@
          
          $csproj = $csproj -replace '</PropertyGroup>', "$versionProps`n  </PropertyGroup>"
          
          if (Test-Path "icon.ico") {
            Write-Host ">>> מטמיע את icon.ico בתוך ה-csproj..."
            $csproj = $csproj -replace '</PropertyGroup>', "<ApplicationIcon>icon.ico</ApplicationIcon>`n  </PropertyGroup>"
          }
          Set-Content UniversalAppProject.csproj -Value $csproj -Encoding UTF8

          $source = $env:FINAL_SOURCE

          $formCode = @"
          using System;
          using System.IO;
          using System.Windows.Forms;
          using System.Diagnostics;
          using System.Net.Http;
          using Microsoft.Web.WebView2.Core;

          namespace UniversalAppProject
          {
              static class Program
              {
                  [STAThread]
                  static void Main()
                  {
                      Application.EnableVisualStyles();
                      Application.SetCompatibleTextRenderingDefault(false);
                      Application.Run(new MainForm());
                  }
              }

              public partial class MainForm : Form
              {
                  private Microsoft.Web.WebView2.WinForms.WebView2? webView;

                  public MainForm()
                  {
                      this.Text = "$appName";
                      this.Width = 1024;
                      this.Height = 768;
                      this.StartPosition = FormStartPosition.CenterScreen;
                      
                      try
                      {
                          string? exePath = Process.GetCurrentProcess().MainModule?.FileName;
                          if (!string.IsNullOrEmpty(exePath))
                          {
                              this.Icon = System.Drawing.Icon.ExtractAssociatedIcon(exePath);
                          }
                      }
                      catch { }

                      if (!IsWebView2RuntimeInstalled())
                      {
                          DialogResult dialogResult = MessageBox.Show(
                              "רכיב המערכת WebView2 לא מותקן.\nהאם תרצה שהמערכת תוריד ותתקין אותו כעת באופן אוטומטי?", 
                              "התקנת רכיבים חסרים", 
                              MessageBoxButtons.YesNo, 
                              MessageBoxIcon.Information);
                              
                          if (dialogResult == DialogResult.Yes)
                          {
                              InstallWebView2Runtime();
                          }
                          else
                          {
                              MessageBox.Show("לא ניתן להפעיל את התוכנה ללא רכיב זה.", "שגיאה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                              Environment.Exit(0);
                          }
                      }
                      else
                      {
                          LoadWebView();
                      }
                  }

                  private bool IsWebView2RuntimeInstalled()
                  {
                      try
                      {
                          string? version = CoreWebView2Environment.GetAvailableBrowserVersionString();
                          return !string.IsNullOrWhiteSpace(version);
                      }
                      catch (Exception)
                      {
                          return false;
                      }
                  }

                  private void InstallWebView2Runtime()
                  {
                      try
                      {
                          string installerPath = Path.Combine(Path.GetTempPath(), "MicrosoftEdgeWebview2Setup.exe");
                          using (HttpClient client = new HttpClient())
                          {
                              byte[] fileBytes = client.GetByteArrayAsync("https://go.microsoft.com/fwlink/p/?LinkId=2124703").GetAwaiter().GetResult();
                              File.WriteAllBytes(installerPath, fileBytes);
                          }
                          
                          Process? process = Process.Start(installerPath);
                          process?.WaitForExit();
                          
                          if (IsWebView2RuntimeInstalled())
                          {
                              LoadWebView();
                          }
                          else
                          {
                              MessageBox.Show("ההתקנה נכשלה או בוטלה.", "שגיאה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                              Environment.Exit(0);
                          }
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show("שגיאה במהלך ניסיון ההתקנה: " + ex.Message, "שגיאה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                          Environment.Exit(0);
                      }
                  }

                  private async void LoadWebView()
                  {
                      webView = new Microsoft.Web.WebView2.WinForms.WebView2();
                      webView.Dock = DockStyle.Fill;
                      this.Controls.Add(webView);
                      
                      try
                      {
                          await webView.EnsureCoreWebView2Async(null);
                          string target = "$source";

                          if (Uri.IsWellFormedUriString(target, UriKind.Absolute) && target.StartsWith("http", StringComparison.OrdinalIgnoreCase)) {
                              webView.CoreWebView2.Navigate(target);
                          } else {
                              string? exePath = Process.GetCurrentProcess().MainModule?.FileName;
                              string exeDir = !string.IsNullOrEmpty(exePath) ? (Path.GetDirectoryName(exePath) ?? AppDomain.CurrentDomain.BaseDirectory) : AppDomain.CurrentDomain.BaseDirectory;
                              string fullPath = Path.Combine(exeDir, target);

                              if (File.Exists(fullPath)) {
                                  webView.CoreWebView2.Navigate(new Uri(fullPath).AbsoluteUri);
                              } else {
                                  webView.CoreWebView2.Navigate(new Uri(Path.Combine(AppDomain.CurrentDomain.BaseDirectory, target)).AbsoluteUri);
                              }
                          }
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show("שגיאה בטעינת האפליקציה: " + ex.Message, "שגיאה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                      }
                  }
              }
          }
          "@

          Set-Content -Path "Program.cs" -Value $formCode -Encoding UTF8

          Write-Host ">>> מבצע Publish ל-EXE עצמאי..."
          dotnet publish -c Release -r win-x64 -p:OutputType=WinExe -o ./final_publish --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

          New-Item -ItemType Directory -Force -Path "build_output"

          $compiledExe = Get-ChildItem -Path "./final_publish" -Filter "*.exe" -File | Select-Object -First 1
          if ($compiledExe) {
              Copy-Item $compiledExe.FullName "build_output/"
              Write-Host ">>> הקובץ הועתק בהצלחה ל-build_output."
          } else {
              Write-Error "שגיאה: קובץ ה-EXE לא נוצר."
              exit 1
          }

      - name: Sign Executable with Persistent Certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> מפענח ומשתמש בתעודה הקבועה לחתימה..."
          
          $certBytes = [System.Convert]::FromBase64String($env:CERT_BASE64)
          $certPath = "$env:TEMP\temp_cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          
          $signtool = (Get-ChildItem "C:\Program Files*\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1).FullName
          
          if ($signtool) {
              Write-Host ">>> מחפש את הקובץ לחתימה..."
              $exeToSign = Get-ChildItem -Path "build_output" -Filter "*.exe" -File | Select-Object -First 1
              
              if ($exeToSign) {
                  Write-Host ">>> חותם על הקובץ: $($exeToSign.Name)..."
                  
                  # הרצת signtool עם פירוט ושרת חותמת זמן
                  & $signtool sign /v /f $certPath /p "$env:CERT_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd SHA256 $exeToSign.FullName
                  
                  # בדיקה אמיתית האם החתימה הצליחה
                  if ($LASTEXITCODE -ne 0) {
                      Write-Error "שגיאה קריטית: signtool נכשל עם קוד יציאה $LASTEXITCODE."
                      exit 1
                  }
                  
                  Write-Host ">>> קובץ ה-EXE נחתם בהצלחה!"
              } else {
                  Write-Error "שגיאה: קובץ ה-EXE לא נמצא בתיקיית build_output לצורך חתימה."
                  exit 1
              }
          } else {
              Write-Error "שגיאה: signtool.exe לא נמצא."
              exit 1
          }
          
          Remove-Item $certPath -Force

      - name: Packaging
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $includeAssets = "${{ github.event.inputs.include_assets }}"
          $fileCount = (Get-ChildItem -Path "build_output" -File).Count

          if ($includeAssets -eq "true" -or $fileCount -gt 1) {
            Compress-Archive -Path "build_output/*" -DestinationPath "${{ github.event.inputs.app_name }}.zip" -Force
            Remove-Item "build_output" -Recurse -Force
            New-Item -ItemType Directory -Force -Path "build_output"
            Move-Item "${{ github.event.inputs.app_name }}.zip" "build_output/"
          }

      - name: Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Output
          path: build_output/
          retention-days: 7
