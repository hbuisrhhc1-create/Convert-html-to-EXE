name: Build Ultimate Fast EXE

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'שם התוכנה המלא (למשל: MyAdvancedApp)'
        required: true
        default: 'MyVault'
        type: string
      app_version:
        description: 'גרסת התוכנה (למשל: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      app_description:
        description: 'תיאור מפורט לתוכנה'
        required: false
        default: 'אפליקציית שולחן עבודה מתקדמת'
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm' # שמירת מטמון אוטומטית לחבילות ה-npm

    - name: Check Cache for Global Tools
      id: cache-tools
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Roaming\npm
          ~\AppData\Roaming\npm-node
        key: ${{ runner.os }}-node-global-tools-${{ hashFiles('**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-global-tools-

    - name: Install Global Tools (Only if not cached)
      if: steps.cache-tools.outputs.cache-hit != 'true'
      run: |
        npm install -g nativefier
        npm install -g png-to-ico

    - name: Process Icon Automatically
      run: |
        if (Test-Path "icon.png") {
            npx png-to-ico icon.png > icon.ico
        }

    - name: Build Ultimate EXE
      run: |
        $argsList = @(
            "--name", "${{ github.event.inputs.app_name }}",
            "--app-version", "${{ github.event.inputs.app_version }}",
            "--description", "${{ github.event.inputs.app_description }}",
            "--single-instance",
            "--background-color", "#ffffff",
            "--disable-gpu-sandbox",
            "--ignore-certificate-errors"
        )

        if (Test-Path "icon.ico") {
            $argsList += "--icon"
            $argsList += "icon.ico"
        }

        nativefier @argsList "index.html" "./output"

    - name: Upload Ultimate EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}-v${{ github.event.inputs.app_version }}-EXE
        path: output/**/*.exe
