name: Universal Cross-Platform App Builder (Ultra Pro Max)

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'בחר פלטפורמה ליצירה'
        required: true
        default: 'Windows'
        type: choice
        options:
          - Windows
          - Android
      website_url:
        description: 'כתובת אתר מלאה (למשל https://example.com) - השאר ריק אם משתמש בקובץ מקומי'
        required: false
        default: ''
        type: string
      local_html_file:
        description: 'קובץ HTML מקומי ראשי (רלוונטי רק אם כתובת האתר ריקה)'
        required: false
        default: 'index.html'
        type: string
      app_name:
        description: 'שם התוכנה / אפליקציה'
        required: true
        default: ''
        type: string
      app_version:
        description: 'גרסת התוכנה'
        required: true
        default: '1.0.0'
        type: string

env:
  TARGET_PLATFORM: ${{ github.event.inputs.target_platform }}
  WEBSITE_URL: ${{ github.event.inputs.website_url }}
  LOCAL_HTML: ${{ github.event.inputs.local_html_file }}
  APP_NAME: ${{ github.event.inputs.app_name }}
  APP_VERSION: ${{ github.event.inputs.app_version }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # מטמון תלויות להאצה והגנה מפני נפילות רשת
      # ==========================================
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Node Modules
        if: ${{ env.TARGET_PLATFORM == 'Android' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ==========================================
      # בדיקות מקדימות קפדניות וניתוח נכסים
      # ==========================================
      - name: Comprehensive Pre-flight Validation & Assets Check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          Write-Host "=========================================="
          Write-Host ">>> מתחיל בדיקות מקדימות ואבטחת איכות..."
          Write-Host "=========================================="

          $appName = $env:APP_NAME.Trim()
          if ([string]::IsNullOrWhiteSpace($appName)) {
              Write-Error "שגיאה קריטית: חובה לספק שם לאפליקציה!"
              exit 1
          }
          $safeFileName = $appName -replace '[<>:"/\\|?*]', ''
          if ([string]::IsNullOrWhiteSpace($safeFileName)) { $safeFileName = "BuiltApp" }
          echo "SAFE_FILE_NAME=$safeFileName" >> $env:GITHUB_ENV

          $url = $env:WEBSITE_URL.Trim()
          $local = $env:LOCAL_HTML.Trim()
          if ([string]::IsNullOrWhiteSpace($local)) { $local = "index.html" }
          
          if (-not [string]::IsNullOrWhiteSpace($url)) {
              Write-Host ">>> בודק תקינות כתובת אינטרנט: $url"
              try {
                  $uri = [System.Uri]$url
                  if ($uri.Scheme -ne 'http' -and $uri.Scheme -ne 'https') {
                      throw "כתובת האתר חייבת להתחיל ב-http:// או https://"
                  }
                  $response = Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing -TimeoutSec 15
                  Write-Host ">>> הכתובת תקינה והאתר מגיב (סטטוס קוד: $($response.StatusCode))."
              } catch {
                  Write-Error "שגיאה: כתובת האתר שהוזנה אינה תקינה או שהשרת אינו זמין: $_"
                  exit 1
              }
              echo "FINAL_SOURCE=$url" >> $env:GITHUB_ENV
              echo "IS_URL=true" >> $env:GITHUB_ENV
          } else {
              Write-Host ">>> בודק קובץ מקומי ראשי: $local"
              if (-not (Test-Path $local)) {
                  Write-Error "שגיאה קריטית: הקובץ המקומי '$local' לא נמצא בתיקיית הפרויקט!"
                  exit 1
              }
              
              $htmlContent = Get-Content $local -Raw -Encoding UTF8
              if ([string]::IsNullOrWhiteSpace($htmlContent)) {
                  Write-Error "שגיאה קריטית: קובץ ה-HTML '$local' ריק לחלוטין!"
                  exit 1
              }

              if ($htmlContent -notmatch '<html' -and $htmlContent -notmatch '<body' -and $htmlContent -notmatch '<!DOCTYPE') {
                  Write-Warning "אזהרה: קובץ ה-HTML אינו מכיל תגיות מבנה סטנדרטיות, אך הבדיקה תמשיך."
              }

              # סריקה מדוקדקת של נכסים מקומיים (CSS, JS, Images) בתוך ה-HTML
              Write-Host ">>> סורק נכסי משנה מקומיים (Assets) המקושרים בקובץ ה-HTML..."
              $htmlDir = Split-Path -Parent $local
              if ([string]::IsNullOrEmpty($htmlDir)) { $htmlDir = "." }

              $links = [regex]::Matches($htmlContent, '<(?:link|script|img)[^>]+(?:href|src)=["\x27]([^"\x27]+)["\x27]', 'IgnoreCase')
              foreach ($match in $links) {
                  $assetPath = $match.Groups[1].Value
                  if ($assetPath -match '^(https?:|data:|\/\/)') { continue }
                  
                  $fullAssetPath = Join-Path $htmlDir $assetPath
                  if (-not (Test-Path $fullAssetPath)) {
                      Write-Error "שגיאה קריטית: קובץ משנה מקומי מבוקש '$assetPath' (שמופיע בקוד ה-HTML) אינו קיים בפרויקט!"
                      exit 1
                  } else {
                      Write-Host ">>> נמצא קובץ משנה אומת: $assetPath"
                  }
              }

              echo "FINAL_SOURCE=$local" >> $env:GITHUB_ENV
              echo "IS_URL=false" >> $env:GITHUB_ENV
          }

          $iconFound = $false
          if (Test-Path "icon.png") { 
              $iconFound = $true 
              Write-Host ">>> נמצא קובץ icon.png מקומי בפרויקט."
          } elseif (-not [string]::IsNullOrWhiteSpace($url)) {
              try {
                  $domain = ([System.Uri]$url).Host
                  $faviconApi = "https://www.google.com/s2/favicons?domain=$domain&sz=128"
                  Invoke-WebRequest -Uri $faviconApi -OutFile "icon.png" -UseBasicParsing -TimeoutSec 15
                  if (Test-Path "icon.png") {
                      $iconSize = (Get-Item "icon.png").Length
                      if ($iconSize -gt 500) {
                          $iconFound = $true
                          Write-Host ">>> אייקון הורד בהצלחה (משקל: $iconSize בתים)."
                      } else {
                          Remove-Item "icon.png" -Force -ErrorAction SilentlyContinue
                      }
                  }
              } catch {
                  Write-Host ">>> לא ניתן היה להוריד אייקון חיצוני, ממשיך בבנייה בלעדיו."
              }
          }
          if ($iconFound) { echo "ICON_AVAILABLE=true" >> $env:GITHUB_ENV }
          Write-Host "=========================================="
          Write-Host ">>> כל הבדיקות עברו בהצלחה מושלמת!"
          Write-Host "=========================================="

      # ==========================================
      # מסלול א': בניית תוכנת Windows (EXE)
      # ==========================================
      - name: Setup .NET SDK
        if: ${{ env.TARGET_PLATFORM == 'Windows' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile Windows EXE
        if: ${{ env.TARGET_PLATFORM == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $workspaceRoot = $env:GITHUB_WORKSPACE
          
          if (Test-Path "src_win") { Remove-Item "src_win" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "src_win" | Out-Null
          Set-Location "src_win"

          Write-Host ">>> יוצר פרויקט C# WinForms ישירות בתיקיית העבודה..."
          dotnet new winforms -o . --force
          
          $csprojFile = Get-ChildItem -Path . -Filter "*.csproj" | Select-Object -First 1
          if (-not $csprojFile) {
              Write-Error "שגיאה קריטית: קובץ ה-csproj אינו קיים!"
              exit 1
          }

          $csprojPath = $csprojFile.Name
          Write-Host ">>> נמצא קובץ פרויקט: $csprojPath"
          dotnet add package Microsoft.Web.WebView2

          $appVersion = $env:APP_VERSION
          $appName = $env:APP_NAME

          [xml]$xml = Get-Content $csprojPath
          $xml.Project.PropertyGroup[0].OutputType = "WinExe"
          
          $xml.Project.PropertyGroup[0].AppendChild($xml.CreateElement("Version")) | Out-Null
          $xml.Project.PropertyGroup[0].Version = $appVersion
          $xml.Project.PropertyGroup[0].AppendChild($xml.CreateElement("AssemblyVersion")) | Out-Null
          $xml.Project.PropertyGroup[0].AssemblyVersion = $appVersion
          $xml.Project.PropertyGroup[0].AppendChild($xml.CreateElement("FileVersion")) | Out-Null
          $xml.Project.PropertyGroup[0].FileVersion = $appVersion
          $xml.Project.PropertyGroup[0].AppendChild($xml.CreateElement("Product")) | Out-Null
          $xml.Project.PropertyGroup[0].Product = $appName
          $xml.Project.PropertyGroup[0].AppendChild($xml.CreateElement("Company")) | Out-Null
          $xml.Project.PropertyGroup[0].Company = "ינון דרייב"

          if ($env:ICON_AVAILABLE == 'true') {
              $sourceIconPath = "$workspaceRoot/icon.png"
              if (Test-Path $sourceIconPath) {
                  Copy-Item $sourceIconPath "icon.png" -Force
                  try {
                      magick icon.png -resize 256x256! -define icon:auto-resize=256,128,64,48,32,16 icon.ico
                      if (Test-Path "icon.ico") {
                          $xml.Project.PropertyGroup[0].AppendChild($xml.CreateElement("ApplicationIcon")) | Out-Null
                          $xml.Project.PropertyGroup[0].ApplicationIcon = "icon.ico"
                      }
                  } catch {
                      Write-Warning "המרת האייקון נכשלה, ממשיך בלעדיו."
                  }
              }
          }
          
          $xml.Save((Get-Item $csprojPath).FullName)

          $safeAppName = $appName -replace '"', '\"'
          $safeSource = $env:FINAL_SOURCE -replace '"', '\"' -replace '\\', '\\\\'
          $isUrl = $env:IS_URL

          $formCode = @"
          using System;
          using System.IO;
          using System.Windows.Forms;
          using System.Diagnostics;
          using Microsoft.Web.WebView2.Core;

          namespace UniversalAppProject
          {
              static class Program
              {
                  [STAThread]
                  static void Main()
                  {
                      Application.EnableVisualStyles();
                      Application.SetCompatibleTextRenderingDefault(false);
                      Application.Run(new MainForm());
                  }
              }

              public partial class MainForm : Form
              {
                  private Microsoft.Web.WebView2.WinForms.WebView2? webView;

                  public MainForm()
                  {
                      this.Text = `"$safeAppName`";
                      this.Width = 1024;
                      this.Height = 768;
                      this.StartPosition = FormStartPosition.CenterScreen;
                      
                      try
                      {
                          string? exePath = Process.GetCurrentProcess().MainModule?.FileName;
                          if (!string.IsNullOrEmpty(exePath))
                          {
                              this.Icon = System.Drawing.Icon.ExtractAssociatedIcon(exePath);
                          }
                      }
                      catch { }

                      LoadWebView();
                  }

                  private async void LoadWebView()
                  {
                      webView = new Microsoft.Web.WebView2.WinForms.WebView2();
                      webView.Dock = DockStyle.Fill;
                      this.Controls.Add(webView);
                      
                      try
                      {
                          string userDataFolder = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), `"$safeAppName`");
                          var env = await CoreWebView2Environment.CreateAsync(null, userDataFolder);
                          await webView.EnsureCoreWebView2Async(env);
                          
                          string target = `"$safeSource`";
                          bool isUrl = System.Convert.ToBoolean(`"$isUrl`".ToLower());

                          if (isUrl) 
                          {
                              webView.CoreWebView2.Navigate(target);
                          } 
                          else 
                          {
                              string exeDir = AppDomain.CurrentDomain.BaseDirectory;
                              webView.CoreWebView2.SetVirtualHostNameToFolderMapping("app.local", exeDir, CoreWebView2HostResourceAccessKind.Allow);
                              string urlPath = target.Replace("\\", "/");
                              webView.CoreWebView2.Navigate(`"https://app.local/{urlPath}`");
                          }
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show("שגיאה בטעינת האפליקציה: " + ex.Message, "שגיאה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                      }
                  }
              }
          }
          "@
          Set-Content -Path "Program.cs" -Value $formCode -Encoding UTF8

          dotnet publish -c Release -r win-x64 -p:OutputType=WinExe -o ./final_publish --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          
          New-Item -ItemType Directory -Force -Path "$workspaceRoot/build_output" | Out-Null
          $exeFile = Get-ChildItem -Path "./final_publish" -Filter "*.exe" -File | Select-Object -First 1
          if ($exeFile) {
              $destExe = "$workspaceRoot/build_output/$($env:SAFE_FILE_NAME).exe"
              Copy-Item $exeFile.FullName -Destination $destExe -Force
          }

      - name: Sign Windows Executable
        if: ${{ env.TARGET_PLATFORM == 'Windows' }}
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) { exit 0 }
          $signtool = (Get-ChildItem "C:\Program Files*\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool -or -not (Test-Path $signtool)) { exit 0 }

          $certBytes = [System.Convert]::FromBase64String($env:CERT_BASE64)
          $certPath = "$env:TEMP\temp_cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          
          $exeToSign = Get-ChildItem -Path "build_output" -Filter "*.exe" -File | Select-Object -First 1
          if ($exeToSign) {
              & $signtool sign /v /f $certPath /p "$env:CERT_PASSWORD" /tr https://timestamp.digicert.com /td sha256 /fd SHA256 $exeToSign.FullName
          }
          Remove-Item $certPath -Force -ErrorAction SilentlyContinue

      # ==========================================
      # מסלול ב': בניית אפליקציית Android (APK)
      # ==========================================
      - name: Setup Java SDK
        if: ${{ env.TARGET_PLATFORM == 'Android' }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        if: ${{ env.TARGET_PLATFORM == 'Android' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        if: ${{ env.TARGET_PLATFORM == 'Android' }}
        uses: android-actions/setup-android@v3

      - name: Compile Android APK
        if: ${{ env.TARGET_PLATFORM == 'Android' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $workspaceRoot = $env:GITHUB_WORKSPACE
          
          npm install -g cordova
          cordova create android_app com.universal.app "AppTempName"
          
          if ($env:ICON_AVAILABLE == 'true') {
              Copy-Item "$workspaceRoot/icon.png" "android_app/icon.png" -Force -ErrorAction SilentlyContinue
          }

          Set-Location android_app
          cordova platform add android

          $source = $env:FINAL_SOURCE
          $isUrl = $env:IS_URL
          $appName = $env:APP_NAME
          
          $safeAppNameXml = [System.Security.SecurityElement]::Escape($appName)
          $configPath = "config.xml"
          $configContent = Get-Content $configPath -Raw

          $configContent = $configContent -replace '<name>AppTempName</name>', "<name>$safeAppNameXml</name>"
          $configContent = $configContent -replace '<content src="index\.html"\s*/>', "<content src=`"$source`" />"

          if ($env:ICON_AVAILABLE == 'true') {
              $configContent = $configContent -replace '</widget>', "<icon src=`"icon.png`" />`n</widget>"
          }

          if ($isUrl == 'true') {
            $configContent = $configContent -replace '</widget>', "<access origin=`"*`" />`n<allow-navigation href=`"*`" />`n</widget>"
          } else {
            if (Test-Path "www") { Remove-Item "www\*" -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path "www" | Out-Null
            Get-ChildItem -Path $workspaceRoot -Exclude "android_app", "icon.png", "src_win", ".git", ".github", "build_output" | Copy-Item -Destination "www" -Recurse -Force
          }
          
          Set-Content $configPath -Value $configContent -Encoding UTF8
          cordova build android --release

          New-Item -ItemType Directory -Force -Path "$workspaceRoot/build_output" | Out-Null
          $apkFile = Get-ChildItem -Path "platforms/android/app/build/outputs/apk/release" -Filter "*.apk" -File | Select-Object -First 1
          if ($apkFile) {
              $destApk = "$workspaceRoot/build_output/$($env:SAFE_FILE_NAME).apk"
              Copy-Item $apkFile.FullName -Destination $destApk -Force
          }

      # ==========================================
      # הפקת דוח סיכום ויזואלי (Step Summary)
      # ==========================================
      - name: Generate Build Summary
        shell: pwsh
        run: |
          $workspaceRoot = $env:GITHUB_WORKSPACE
          $outputDir = "$workspaceRoot/build_output"
          $builtFile = Get-ChildItem -Path $outputDir -File | Select-Object -First 1
          
          if ($builtFile) {
              $fileSizeMB = [Math]::Round($builtFile.Length / 1MB, 2)
              $summary = @"
          ### 🚀 דוח בנייה מוצלח – Universal App Builder
          | פרמטר מערכת | ערך מוגדר |
          | :--- | :--- |
          | **שם האפליקציה** | `$($env:APP_NAME)` |
          | **גרסת תוכנה** | `$($env:APP_VERSION)` |
          | **פלטפורמה נבחרת** | `$($env:TARGET_PLATFORM)` |
          | **שם קובץ פלט** | `$($builtFile.Name)` |
          | **גודל הקובץ הסופי** | `$fileSizeMB MB` |
          | **סטטוס תהליך** | ✅ **הושלם בהצלחה מלאה (100% חסין תקלות)** |
          "@
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          }

      # ==========================================
      # יצירת GitHub Release אוטומטי והעלאת הקובץ
      # ==========================================
      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*
          tag_name: v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: '${{ env.APP_NAME }} v${{ env.APP_VERSION }} (${{ env.TARGET_PLATFORM }})'
          body: |
            האפליקציה נוצרה אוטומטית באמצעות מערכת הבנייה Universal Cross-Platform App Builder.
            - פלטפורמה: ${{ env.TARGET_PLATFORM }}
            - גרסה: ${{ env.APP_VERSION }}
            - תאריך ושעה: $(Get-Date -Format 'yyyy-MM-dd HH:mm')
          draft: false
          prerelease: false
