name: Universal Dynamic App Builder

on:
  workflow_dispatch:
    inputs:
      target_source:
        description: 'כתובת האתר (URL) או נתיב הקובץ לאריזה'
        required: true
        default: 'index.html'
        type: string
      app_name:
        description: 'שם התוכנה'
        required: true
        default: 'UniversalApp'
        type: string
      app_version:
        description: 'גרסת התוכנה'
        required: true
        default: '1.0.0'
        type: string
      include_assets:
        description: 'האם התוכנה כוללת תיקיות נלוות/הגדרות נוספות (יוצר ZIP במידת הצורך)'
        required: true
        default: false
        type: boolean

jobs:
  build-universal:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pre-flight & Validation
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> מאמת קבצי מקור..."
          $source = "${{ github.event.inputs.target_source }}"
          
          if ($source -notmatch "^https?://") {
            if (-not (Test-Path $source)) {
              Write-Error "שגיאה קריטית: היעד המקומי '$source' לא נמצא!"
              exit 1
            }
          }
          if (Test-Path "favicon.png") {
            npx --yes png-to-ico favicon.png > icon.ico
          }

      - name: Compile Standalone WebView2 EXE
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> יוצר פרויקט C# מושלם עם נקודת כניסה (Main)..."

          dotnet new winforms -n UniversalAppProject -o . --force
          dotnet add package Microsoft.Web.WebView2

          $appName = "${{ github.event.inputs.app_name }}"
          $source = "${{ github.event.inputs.target_source }}"

          # כתיבת קוד מלא הכולל גם את ה-Main וגם את ה-MainForm
          $formCode = @"
          using System;
          using System.IO;
          using System.Windows.Forms;
          using Microsoft.Web.WebView2.Core;

          namespace UniversalAppProject
          {
              static class Program
              {
                  [STAThread]
                  static void Main()
                  {
                      Application.EnableVisualStyles();
                      Application.SetCompatibleTextRenderingDefault(false);
                      Application.Run(new MainForm());
                  }
              }

              public partial class MainForm : Form
              {
                  private Microsoft.Web.WebView2.WinForms.WebView2 webView;

                  public MainForm()
                  {
                      this.Text = "$appName";
                      this.Width = 1024;
                      this.Height = 768;
                      this.StartPosition = FormStartPosition.CenterScreen;
                      
                      webView = new Microsoft.Web.WebView2.WinForms.WebView2();
                      webView.Dock = DockStyle.Fill;
                      this.Controls.Add(webView);
                      
                      InitializeAsync();
                  }

                  private async void InitializeAsync()
                  {
                      try
                      {
                          await webView.EnsureCoreWebView2Async(null);
                          string target = "$source";
                          if (Uri.IsWellFormedUriString(target, UriKind.Absolute)) {
                              webView.CoreWebView2.Navigate(target);
                          } else {
                              string fullPath = Path.Combine(AppDomain.CurrentDomain.BaseDirectory, target);
                              webView.CoreWebView2.Navigate(fullPath);
                          }
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show("שגיאה בטעינת רכיב ה-WebView2: " + ex.Message, "שגיאה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                      }
                  }
              }
          }
          "@

          Set-Content -Path "Program.cs" -Value $formCode -Encoding UTF8

          Write-Host ">>> מבצע בנייה וקומפילציה מלאה..."
          dotnet build -c Release

          New-Item -ItemType Directory -Force -Path "build_output"

          $compiledExe = Get-ChildItem -Path "." -Filter "UniversalAppProject.exe" -Recurse | Select-Object -First 1
          if (-not $compiledExe) {
            $compiledExe = Get-ChildItem -Path "bin\Release" -Filter "*.exe" -Recurse | Select-Object -First 1
          }

          if ($compiledExe) {
            Copy-Item $compiledExe.FullName "build_output/"
            Write-Host "אישור: קובץ ה-EXE נמצא והועתק בהצלחה: $($compiledExe.FullName)"
          } else {
            Write-Error "שגיאה קריטית: קובץ ה-EXE המקומפל לא נמצא באף תיקייה."
            exit 1
          }
          
          if ($source -notmatch "^https?://") {
            if (Test-Path $source) { Copy-Item $source "build_output/" }
          }
          if (Test-Path "icon.ico") { Copy-Item "icon.ico" "build_output/" }

      - name: Smart Packaging (Conditional ZIP)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $includeAssets = "${{ github.event.inputs.include_assets }}"
          $fileCount = (Get-ChildItem -Path "build_output" -File).Count

          Write-Host "כמות הקבצים בתיקיית הפלט: $fileCount"

          if ($includeAssets -eq "true" -or $fileCount -gt 2) {
            Write-Host ">>> זוהו מספר קבצים - יוצר קובץ ZIP אוטומטי..."
            & "7z" a -tzip -mx=9 "UniversalApp-Release.zip" "build_output/*"
            
            Remove-Item "build_output" -Recurse -Force
            New-Item -ItemType Directory -Force -Path "build_output"
            Move-Item "UniversalApp-Release.zip" "build_output/"
          } else {
            Write-Host ">>> זוהו קבצים בודדים בלבד - מעלה ישירות."
          }

      - name: Health Check & Size Diagnostic Report
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "================ דוח בדיקת תקינות ונפח ================"
          
          $outputFiles = Get-ChildItem -Path "build_output" -Recurse
          $totalSize = 0

          foreach ($file in $outputFiles) {
            if (-not $file.PSIsContainer) {
              $sizeMB = [Math]::Round($file.Length / 1MB, 2)
              $totalSize += $file.Length
              Write-Host " - קובץ: $($file.Name) | נפח: $sizeMB MB"
            }
          }

          $totalSizeMB = [Math]::Round($totalSize / 1MB, 2)
          Write-Host "--------------------------------------------------------"
          Write-Host " סך הכל נפח תיקיית התוצר: $totalSizeMB MB"

          if ($totalSizeMB -gt 500) {
            Write-Warning "אזהרה: נפח התוכנה גבוה ממה שצפוי לאפליקציה רזה!"
          } else {
            Write-Host "אישור: הנפח תקין לחלוטין ורחוק מאוד מג'יגה-בייטים מיותרים."
          }
          Write-Host "========================================================"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-App-Output
          path: build_output/
          retention-days: 7
