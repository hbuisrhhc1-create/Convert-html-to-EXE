name: Universal Cross-Platform App Builder (Massive Autonomous Adaptive Engine)

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'בחר פלטפורמה ליצירה'
        required: true
        default: 'Windows'
        type: choice
        options:
          - Windows
          - Android
      website_url:
        description: 'כתובת אתר מלאה (למשל https://example.com) - השאר ריק אם משתמש בקובץ מקומי'
        required: false
        default: ''
        type: string
      local_html_file:
        description: 'קובץ HTML מקומי ראשי (רלוונטי רק אם כתובת האתר ריקה)'
        required: false
        default: 'index.html'
        type: string
      app_name:
        description: 'שם התוכנה / אפליקציה'
        required: true
        default: ''
        type: string
      app_version:
        description: 'גרסת התוכנה'
        required: true
        default: '1.0.0'
        type: string

env:
  TARGET_PLATFORM: ${{ github.event.inputs.target_platform }}
  WEBSITE_URL: ${{ github.event.inputs.website_url }}
  LOCAL_HTML: ${{ github.event.inputs.local_html_file }}
  APP_NAME: ${{ github.event.inputs.app_name }}
  APP_VERSION: ${{ github.event.inputs.app_version }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # ניקוי אגרסיבי למניעת תיקיות מקוננות ישנות
      # ==========================================
      - name: Force Clean Workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> מנקה לחלוטין תיקיות בנייה ישנות ומקוננות..."
          
          if (Test-Path "src_win") { Remove-Item "src_win" -Recurse -Force }
          if (Test-Path "android_app") { Remove-Item "android_app" -Recurse -Force }
          if (Test-Path "build_output") { Remove-Item "build_output" -Recurse -Force }
          
          # הסרת כל שאריות נתיבים ארוכים או מקוננים במידה ונוצרו
          Get-ChildItem -Path . -Recurse -Filter "src_win" | ForEach-Object {
              try { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue } catch {}
          }

      # ==========================================
      # מטמון תלויות חכם
      # ==========================================
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Node Modules
        if: ${{ env.TARGET_PLATFORM == 'Android' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ==========================================
      # בדיקות מקדימות
      # ==========================================
      - name: Pre-flight Validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          $appName = $env:APP_NAME.Trim()
          if ([string]::IsNullOrWhiteSpace($appName)) { Write-Error "חובה לספק שם לאפליקציה!"; exit 1 }
          $safeFileName = $appName -replace '[<>:"/\\|?*]', ''
          if ([string]::IsNullOrWhiteSpace($safeFileName)) { $safeFileName = "BuiltApp" }
          echo "SAFE_FILE_NAME=$safeFileName" >> $env:GITHUB_ENV

          $url = $env:WEBSITE_URL.Trim()
          $local = $env:LOCAL_HTML.Trim()
          if ([string]::IsNullOrWhiteSpace($local)) { $local = "index.html" }
          
          if (-not [string]::IsNullOrWhiteSpace($url)) {
              echo "FINAL_SOURCE=$url" >> $env:GITHUB_ENV
              echo "IS_URL=true" >> $env:GITHUB_ENV
          } else {
              if (-not (Test-Path $local)) { Write-Error "הקובץ המקומי $local לא נמצא!"; exit 1 }
              echo "FINAL_SOURCE=$local" >> $env:GITHUB_ENV
              echo "IS_URL=false" >> $env:GITHUB_ENV
          }

          if (Test-Path "icon.png") { echo "ICON_AVAILABLE=true" >> $env:GITHUB_ENV }

      # ==========================================
      # בניית Windows עם הגנה מלאה
      # ==========================================
      - name: Setup .NET SDK
        if: ${{ env.TARGET_PLATFORM == 'Windows' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile Windows EXE with Massive Autonomous Engine
        if: ${{ env.TARGET_PLATFORM == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $workspaceRoot = $env:GITHUB_WORKSPACE

          function Remove-LockedFolderForce {
              param([string]$FolderPath)
              if (Test-Path $FolderPath) {
                  Stop-Process -Name "dotnet", "msbuild", "signtool", "vBC" -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2
                  Get-ChildItem -Path $FolderPath -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {
                      try { $_.Attributes = 'Normal' } catch { }
                  }
                  for ($i = 1; $i -le 4; $i++) {
                      try { Remove-Item $FolderPath -Recurse -Force -ErrorAction Stop; break } catch { Start-Sleep -Seconds 3 }
                  }
              }
          }

          function Invoke-MassiveWindowsEngine {
              param([scriptblock]$ScriptBlock, [string]$ContextName)
              $maxStrategies = 10
              $currentStrategy = 1
              $workspaceRoot = $env:GITHUB_WORKSPACE

              while ($currentStrategy -le $maxStrategies) {
                  try {
                      Set-Location $workspaceRoot
                      Write-Host ">>> [$ContextName] מריץ אסטרטגיית תיקון מספר $currentStrategy/$maxStrategies..."
                      & $ScriptBlock
                      Write-Host ">>> [$ContextName] הבנייה הוכתרה בהצלחה!"
                      return
                  } catch {
                      $errorMessage = $_.Exception.Message
                      Write-Warning "⚠️ שגיאה ברובד $ContextName (ניסיון $currentStrategy/$maxStrategies): $errorMessage"

                      if ($currentStrategy -eq $maxStrategies) {
                          Write-Error "❌ כל 10 אסטרטגיות התיקון האוטונומיות עבור Windows מוצו."
                          throw $_
                      }

                      Write-Host ">>> מנוע ה-AI מנתח ומפעיל את האסטרטגיה הבאה ברשימה..."
                      Set-Location $workspaceRoot
                      
                      switch ($currentStrategy) {
                          1 {
                              Stop-Process -Name "dotnet", "msbuild" -Force -ErrorAction SilentlyContinue
                              Remove-LockedFolderForce "$workspaceRoot/src_win/obj"
                          }
                          2 {
                              Remove-LockedFolderForce "$workspaceRoot/src_win/obj"
                              Remove-LockedFolderForce "$workspaceRoot/src_win/bin"
                          }
                          3 { dotnet nuget locals all --clear }
                          4 {
                              if (Test-Path "$workspaceRoot/src_win") {
                                  Get-ChildItem -Path "$workspaceRoot/src_win" -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Attributes = 'Normal' }
                              }
                          }
                          5 {
                              if (Test-Path "$workspaceRoot/src_win") {
                                  Set-Location "$workspaceRoot/src_win"
                                  dotnet restore --force --no-cache
                              }
                          }
                          6 {
                              Remove-LockedFolderForce "$workspaceRoot/src_win/final_publish"
                              Remove-LockedFolderForce "$workspaceRoot/src_win/bin/Release"
                          }
                          7 { Remove-LockedFolderForce "$env:LocalAppData\Microsoft\MSBuild" }
                          8 { dotnet build-server shutdown }
                          9 { Remove-LockedFolderForce "$workspaceRoot/src_win" }
                          default { Start-Sleep -Seconds 5 }
                      }

                      Set-Location $workspaceRoot
                      $currentStrategy++
                      Start-Sleep -Seconds 3
                  }
              }
          }

          $BuildWindowsLogic = {
              Set-Location $workspaceRoot
              if (-not (Test-Path "$workspaceRoot/src_win")) {
                  New-Item -ItemType Directory -Force -Path "$workspaceRoot/src_win" | Out-Null
                  Set-Location "$workspaceRoot/src_win"
                  Write-Host ">>> יוצר שלד פרויקט C# WinForms חדש מאפס..."
                  dotnet new winforms -o . --force
                  dotnet add package Microsoft.Web.WebView2
              } else {
                  Set-Location "$workspaceRoot/src_win"
              }

              $csprojFile = Get-ChildItem -Path . -Filter "*.csproj" | Select-Object -First 1
              if (-not $csprojFile) { throw "קובץ ה-csproj חסר או נפגם!" }
              $csprojPath = $csprojFile.Name

              $appVersion = $env:APP_VERSION
              $appName = $env:APP_NAME

              [xml]$xml = Get-Content $csprojPath
              if (-not $xml.Project -or -not $xml.Project.PropertyGroup) {
                  throw "מבנה קובץ ה-csproj אינו תקין או ריק!"
              }
              $pg = $xml.Project.PropertyGroup[0]

              function Set-XmlProperty {
                  param($Parent, $TagName, $Value)
                  $node = $Parent.$TagName
                  if ($node) {
                      $Parent.$TagName = $Value
                  } else {
                      $elem = $xml.CreateElement($TagName)
                      $elem.InnerText = $Value
                      $Parent.AppendChild($elem) | Out-Null
                  }
              }

              Set-XmlProperty -Parent $pg -TagName "OutputType" -Value "WinExe"
              Set-XmlProperty -Parent $pg -TagName "Version" -Value $appVersion
              Set-XmlProperty -Parent $pg -TagName "AssemblyVersion" -Value $appVersion
              Set-XmlProperty -Parent $pg -TagName "FileVersion" -Value $appVersion
              Set-XmlProperty -Parent $pg -TagName "Product" -Value $appName
              Set-XmlProperty -Parent $pg -TagName "Company" -Value "ינון דרייב"

              if ($env:ICON_AVAILABLE == 'true' -and (Test-Path "$workspaceRoot/icon.png")) {
                  Copy-Item "$workspaceRoot/icon.png" "icon.png" -Force
                  try {
                      magick icon.png -resize 256x256! -define icon:auto-resize=256,128,64,48,32,16 icon.ico
                      if (Test-Path "icon.ico") {
                          Set-XmlProperty -Parent $pg -TagName "ApplicationIcon" -Value "icon.ico"
                      }
                  } catch { }
              }
              $xml.Save((Get-Item $csprojPath).FullName)

              $safeAppName = $appName -replace '"', '\"'
              $safeSource = $env:FINAL_SOURCE -replace '"', '\"' -replace '\\', '\\\\'
              $isUrl = $env:IS_URL

              $formCodeLines = @(
                  "using System;",
                  "using System.IO;",
                  "using System.Windows.Forms;",
                  "using System.Diagnostics;",
                  "using Microsoft.Web.WebView2.Core;",
                  "namespace UniversalAppProject",
                  "{",
                  "    static class Program",
                  "    {",
                  "        [STAThread]",
                  "        static void Main()",
                  "        {",
                  "            Application.EnableVisualStyles();",
                  "            Application.SetCompatibleTextRenderingDefault(false);",
                  "            Application.Run(new MainForm());",
                  "        }",
                  "    }",
                  "    public partial class MainForm : Form",
                  "    {",
                  "        private Microsoft.Web.WebView2.WinForms.WebView2? webView;",
                  "        public MainForm()",
                  "        {",
                  "            this.Text = `"$safeAppName`";",
                  "            this.Width = 1024;",
                  "            this.Height = 768;",
                  "            this.StartPosition = FormStartPosition.CenterScreen;",
                  "            try",
                  "            {",
                  "                string? exePath = Process.GetCurrentProcess().MainModule?.FileName;",
                  "                if (!string.IsNullOrEmpty(exePath))",
                  "                {",
                  "                    this.Icon = System.Drawing.Icon.ExtractAssociatedIcon(exePath);",
                  "                }",
                  "            }",
                  "            catch { }",
                  "            LoadWebView();",
                  "        }",
                  "        private async void LoadWebView()",
                  "        {",
                  "            webView = new Microsoft.Web.WebView2.WinForms.WebView2();",
                  "            webView.Dock = DockStyle.Fill;",
                  "            this.Controls.Add(webView);",
                  "            try",
                  "            {",
                  "                string userDataFolder = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), `"$safeAppName`");",
                  "                var env = await CoreWebView2Environment.CreateAsync(null, userDataFolder);",
                  "                await webView.EnsureCoreWebView2Async(env);",
                  "                string target = `"$safeSource`";",
                  "                bool isUrl = System.Convert.ToBoolean(`"$isUrl`".ToLower());",
                  "                if (isUrl) {",
                  "                    webView.CoreWebView2.Navigate(target);",
                  "                } else {",
                  "                    string exeDir = AppDomain.CurrentDomain.BaseDirectory;",
                  "                    webView.CoreWebView2.SetVirtualHostNameToFolderMapping(`"app.local`", exeDir, CoreWebView2HostResourceAccessKind.Allow);",
                  "                    string urlPath = target.Replace(`"\\`", `"/`");",
                  "                    webView.CoreWebView2.Navigate(`"https://app.local/{urlPath}`");",
                  "                }",
                  "            }",
                  "            catch (Exception ex)",
                  "            {",
                  "                MessageBox.Show(`"שגיאה בטעינת האפליקציה: `" + ex.Message, `"שגיאה`", MessageBoxButtons.OK, MessageBoxIcon.Error);",
                  "            }",
                  "        }",
                  "    }",
                  "}"
              )
              $formCodeLines | Set-Content -Path "Program.cs" -Encoding UTF8

              Write-Host ">>> מריץ תהליך קומפילציה מלא (Publish)..."
              dotnet publish -c Release -r win-x64 -p:OutputType=WinExe -o ./final_publish --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
              
              New-Item -ItemType Directory -Force -Path "$workspaceRoot/build_output" | Out-Null
              $exeFile = Get-ChildItem -Path "./final_publish" -Filter "*.exe" -File | Select-Object -First 1
              if ($exeFile) {
                  Copy-Item $exeFile.FullName -Destination "$workspaceRoot/build_output/$($env:SAFE_FILE_NAME).exe" -Force
              }
          }

          Invoke-MassiveWindowsEngine -ScriptBlock $BuildWindowsLogic -ContextName "Windows Compilation Engine"

      # ==========================================
      # סיכום והעלאה
      # ==========================================
      - name: Generate Build Summary
        shell: pwsh
        run: |
          $workspaceRoot = $env:GITHUB_WORKSPACE
          $outputDir = "$workspaceRoot/build_output"
          $builtFile = Get-ChildItem -Path $outputDir -File | Select-Object -First 1
          
          if ($builtFile) {
              $summary = @"
          ### 🚀 דוח בנייה – מנוע Autonomous Massive Adaptive
          | פרמטר מערכת | ערך מוגדר |
          | :--- | :--- |
          | **שם האפליקציה** | `$($env:APP_NAME)` |
          | **גרסת תוכנה** | `$($env:APP_VERSION)` |
          | **פלטפורמה** | `$($env:TARGET_PLATFORM)` |
          | **קובץ פלט** | `$($builtFile.Name)` |
          | **סטטוס** | ✅ **הושלם בהצלחה אוטונומית מלאה** |
          "@
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          }

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*
          tag_name: v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: '${{ env.APP_NAME }} v${{ env.APP_VERSION }} (${{ env.TARGET_PLATFORM }})'
          body: |
            האפליקציה נוצרה בהצלחה.
          draft: false
          prerelease: false
