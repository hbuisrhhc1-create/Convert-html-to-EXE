name: Build EXE

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'שם התוכנה (למשל: MyVault)'
        required: true
        default: 'MyVault'
        type: string
      app_version:
        description: 'גרסת התוכנה (למשל: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      app_description:
        description: 'תיאור קצר לתוכנה'
        required: false
        default: 'אפליקציית שולחן עבודה'
        type: string
      icon_choice:
        description: 'שם קובץ האייקון המבוקש (למשל: icon.png)'
        required: false
        default: 'icon.png'
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node.js & npx modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            C:\Users\runneradmin\AppData\Local\npm-cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Scan Repository Images & Pre-flight
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=========================================="
          Write-Host ">>> [עברית] סורק את התמונות הקיימות במאגר..."
          Write-Host "=========================================="

          # סריקת כל קבצי התמונה הקיימים והצגתם ביומן הריצה
          $allImages = Get-ChildItem -Path "." -Include "*.png", "*.ico", "*.jpg" -Recurse
          if ($allImages) {
            Write-Host "מצאתי את קבצי התמונה הבאים במאגר שלך:" -ForegroundColor Green
            foreach ($img in $allImages) {
              $sizeKB = [math]::Round($img.Length / 1KB, 2)
              Write-Host "  - שם: $($img.Name) | גודל: $sizeKB KB | נתיב: $($img.FullName)"
            }
          } else {
            Write-Host "לא נמצאו קבצי תמונה במאגר." -ForegroundColor Yellow
          }

          if (Test-Path "output") { 
            Remove-Item -Recurse -Force "output" 
          }

          if (-not (Test-Path "index.html")) {
            Write-Error "CRITICAL: index.html is missing!"
            exit 1
          }

          $selectedIcon = "${{ github.event.inputs.icon_choice }}"
          Write-Host ">>> בחרת להשתמש באייקון: $selectedIcon" -ForegroundColor Cyan
          
          if (-not [string]::IsNullOrWhiteSpace($selectedIcon) -and (Test-Path $selectedIcon)) {
            Write-Host "הקובץ נמצא בהצלחה! מתחיל עיבוד ואפשור..."
            $ext = [System.IO.Path]::GetExtension($selectedIcon)
            
            if ($ext -eq ".png") {
              npx --yes png-to-ico $selectedIcon > icon.ico
              Write-Host "OK: Converted $selectedIcon to icon.ico"
            } elseif ($ext -eq ".ico") {
              Copy-Item $selectedIcon "icon.ico"
              Write-Host "OK: Copied $selectedIcon to icon.ico"
            }
          } else {
            Write-Host "==> [הודעה] קובץ האייקון שבחרת '$selectedIcon' לא נמצא. ממשיך בבנייה רגילה." -ForegroundColor Yellow
          }
          
          Write-Host "=== הבדיקות המקדימות הסתיימו בהצלחה ==="

      - name: Build EXE with Nativefier
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=========================================="
          Write-Host ">>> [עברית] מתחיל בתהליך יצירת קובץ ה-EXE..."
          Write-Host "=========================================="

          $appName = "${{ github.event.inputs.app_name }}"
          $appVersion = "${{ github.event.inputs.app_version }}"
          $appDesc = "${{ github.event.inputs.app_description }}"
          $hasIcon = Test-Path "icon.ico"

          $argsList = @(
            "--name", $appName,
            "--app-version", $appVersion,
            "--description", $appDesc,
            "--single-instance",
            "--background-color", "#ffffff",
            "--disable-gpu-sandbox",
            "--ignore-certificate-errors",
            "--tray", "false",
            "--platform", "windows",
            "--arch", "x64"
          )
          
          if ($hasIcon) {
            $argsList += "--icon"
            $argsList += "icon.ico"
          }

          # הרצה ישירה שמציגה את כל הפלט באנגלית בזמן אמת
          npx --yes nativefier @argsList "index.html" "./output"

      - name: Verify outputs and compress
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=== [עברית] בודק את תוצאות הביצוע ומארז לקובץ ZIP ==="

          $exeFiles = Get-ChildItem -Path "output" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) {
            foreach ($file in $exeFiles) {
              Write-Host "SUCCESS: Found EXE -> $($file.FullName)"
            }
            Compress-Archive -Path "output/*" -DestinationPath "app-release.zip" -Force
            Write-Host "OK: Compressed output folder into app-release.zip successfully."
          } else {
            Write-Error "CRITICAL: Build finished but no .exe was found!"
            exit 1
          }

      - name: Upload EXE Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-v${{ github.event.inputs.app_version }}-Package
          path: |
            output/**/*.exe
            app-release.zip
          retention-days: 7
