name: Build EXE

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'שם התוכנה (למשל: MyVault)'
        required: true
        default: 'MyVault'
        type: string
      app_version:
        description: 'גרסת התוכנה (למשל: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      app_description:
        description: 'תיאור קצר לתוכנה'
        required: false
        default: 'אפליקציית שולחן עבודה'
        type: string
      icon_choice:
        description: 'שם קובץ האייקון המבוקש (למשל: icon.png)'
        required: false
        default: 'icon.png'
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean disk space & Pre-flight
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=== מנקה תיקיות ישנות כדי לפנות מקום בדיסק ==="
          
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "output") { Remove-Item -Recurse -Force "output" }

          if (-not (Test-Path "index.html")) {
            Write-Error "שגיאה קריטית: קובץ ה-index.html לא נמצא!"
            exit 1
          }

          $selectedIcon = "${{ github.event.inputs.icon_choice }}"
          if (-not [string]::IsNullOrWhiteSpace($selectedIcon) -and (Test-Path $selectedIcon)) {
            $ext = [System.IO.Path]::GetExtension($selectedIcon)
            if ($ext -eq ".png") {
              npx --yes png-to-ico $selectedIcon > icon.ico
            } elseif ($ext -eq ".ico") {
              Copy-Item $selectedIcon "icon.ico"
            }
          }

      - name: Build EXE with Nativefier
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=== מתחיל ביצירת קובץ ה-EXE ==="

          $appName = "${{ github.event.inputs.app_name }}"
          $appVersion = "${{ github.event.inputs.app_version }}"
          $appDesc = "${{ github.event.inputs.app_description }}"
          $hasIcon = Test-Path "icon.ico"

          $argsList = @(
            "--name", $appName,
            "--app-version", $appVersion,
            "--description", $appDesc,
            "--single-instance",
            "--disable-gpu-sandbox",
            "--tray", "false",
            "--platform", "windows",
            "--arch", "x64"
          )
          
          if ($hasIcon) {
            $argsList += "--icon"
            $argsList += "icon.ico"
          }

          npm install -g nativefier
          nativefier @argsList "index.html" "./dist"

      - name: Direct Compression with 7-Zip (No Duplication)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=== דוחס ישירות את תיקיית הפלט ללא שכבות מיותרות ==="

          # מוצא את התיקייה הפנימית שנוצרה בתוך dist ودוחס אך ורק את התוכן שלה ישירות ל-ZIP
          $targetDir = (Get-ChildItem -Path "dist" -Directory | Select-Object -First 1).FullName
          
          if ($targetDir) {
            & "7z" a -tzip Release.zip "$targetDir/*"
            Write-Host "OK: הדחיסה הושלמה בהצלחה בלי לבזבז מקום בדיסק!"
          } else {
            Write-Error "שגיאה: תיקיית היעד לא נמצאה."
            exit 1
          }

      - name: Upload EXE Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-v${{ github.event.inputs.app_version }}-Package
          path: Release.zip
          retention-days: 7
