name: Build EXE

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'שם התוכנה (למשל: MyVault)'
        required: true
        default: 'MyVault'
        type: string
      app_version:
        description: 'גרסת התוכנה (למשל: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      app_description:
        description: 'תיאור קצר לתוכנה'
        required: false
        default: 'אפליקציית שולחן עבודה'
        type: string
      icon_choice:
        description: 'שם קובץ האייקון המבוקש (למשל: icon.png)'
        required: false
        default: 'icon.png'
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node.js & npx modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            C:\Users\runneradmin\AppData\Local\npm-cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Pre-flight & Icon Processing (Hebrew Logs)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "=== מתחיל בדיקות מקדימות וסידור סביבת העבודה ==="
          
          if (Test-Path "output") { 
            Write-Host "מנקה תיקיית פלט ישנה..."
            Remove-Item -Recurse -Force "output" 
          }

          if (-not (Test-Path "index.html")) {
            Write-Error "שגיאה קריטית: קובץ ה-index.html לא נמצא בתיקיית השורש של הפרויקט!"
            exit 1
          }
          Write-Host "אישור: קובץ index.html נמצא ותקין."

          $selectedIcon = "${{ github.event.inputs.icon_choice }}"
          
          if (-not [string]::IsNullOrWhiteSpace($selectedIcon) -and (Test-Path $selectedIcon)) {
            Write-Host "מצאתי את קובץ האייקון שבחרת: $selectedIcon. מתחיל המרה..."
            $ext = [System.IO.Path]::GetExtension($selectedIcon)
            
            if ($ext -eq ".png") {
              npx --yes png-to-ico $selectedIcon > icon.ico
              Write-Host "אישור: קובץ ה-PNG הומר בהצלחה לפורמט ICO."
            } elseif ($ext -eq ".ico") {
              Copy-Item $selectedIcon "icon.ico"
              Write-Host "אישור: קובץ ה-ICO הועתק בהצלחה."
            }
          } else {
            Write-Warning "אזהרה: קובץ האייקון '$selectedIcon' לא נמצא במאגר. ממשיך בבנייה ללא אייקון מותאם אישית (יוצר ללא עצירה)."
          }
          
          Write-Host "=== הבדיקות המקדימות הסתיימו בהצלחה ==="

      - name: Multi-Method EXE Compilation Pipeline (Hebrew Logs)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $appName = "${{ github.event.inputs.app_name }}"
          $appVersion = "${{ github.event.inputs.app_version }}"
          $appDesc = "${{ github.event.inputs.app_description }}"
          $hasIcon = Test-Path "icon.ico"

          $success = $false

          # ==========================================
          # שיטה 1: אריזה סטנדרטית
          # ==========================================
          Write-Host "`n>>> [שיטה 1 מתוך 3] מנסה ליצור את התוכנה באריזה סטנדרטית..."
          if (Test-Path "output") { Remove-Item -Recurse -Force "output" }
          
          $args1 = @(
            "--name", $appName,
            "--app-version", $appVersion,
            "--description", $appDesc,
            "--single-instance",
            "--background-color", "#ffffff",
            "--disable-gpu-sandbox",
            "--ignore-certificate-errors",
            "--tray", "false",
            "--platform", "windows",
            "--arch", "x64"
          )
          if ($hasIcon) { $args1 += "--icon"; $args1 += "icon.ico" }

          try {
            npx --yes nativefier @args1 "index.html" "./output"
            $exe = Get-ChildItem -Path "output" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
            if ($exe) {
              Write-Host "הצלחה! שיטה 1 יצרה את קובץ ה-EXE כמו שצריך."
              $success = $true
            }
          } catch {
            Write-Warning "שיטה 1 נכשלה, עובר לשיטה הבאה..."
          }

          # ==========================================
          # שיטה 2: נטרול Sandbox
          # ==========================================
          if (-not $success) {
            Write-Host "`n>>> [שיטה 2 מתוך 3] מנסה אריזה עם נטרול מנגנוני אבטחה (Sandbox)..."
            if (Test-Path "output") { Remove-Item -Recurse -Force "output" }

            $args2 = @(
              "--name", $appName,
              "--app-version", $appVersion,
              "--single-instance",
              "--disable-gpu",
              "--insecure",
              "--tray", "false",
              "--platform", "windows",
              "--arch", "x64"
            )
            if ($hasIcon) { $args2 += "--icon"; $args2 += "icon.ico" }

            try {
              npx --yes nativefier @args2 "index.html" "./output"
              $exe = Get-ChildItem -Path "output" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
              if ($exe) {
                Write-Host "הצלחה! שיטה 2 יצרה את קובץ ה-EXE בהצלחה."
                $success = $true
              }
            } catch {
              Write-Warning "שיטה 2 נכשלה, עובר לשיטת הגיבוי האחרונה..."
            }
          }

          # ==========================================
          # שיטה 3: אריזה בסיסית ונקייה
          # ==========================================
          if (-not $success) {
            Write-Host "`n>>> [שיטה 3 מתוך 3] מנסה אריזה בסיסית ומינימלית..."
            if (Test-Path "output") { Remove-Item -Recurse -Force "output" }

            $args3 = @(
              "--name", $appName,
              "--platform", "windows",
              "--arch", "x64",
              "--tray", "false"
            )

            try {
              npx --yes nativefier @args3 "index.html" "./output"
              $exe = Get-ChildItem -Path "output" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
              if ($exe) {
                Write-Host "הצלחה! שיטה 3 הבסיסית הצליחה לייצר את הקובץ."
                $success = $true
              }
            } catch {
              Write-Warning "שיטה 3 נכשלה."
            }
          }

          if (-not $success) {
            Write-Error "שגיאה קריטית: כל השיטות נכשלו ביצירת קובץ ה-EXE."
            exit 1
          }

          Write-Host "`n>>> תהליך היצירה הסתיים בהצלחה רבה!"

      - name: Post-Build Compression & Packaging
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $exeFiles = Get-ChildItem -Path "output" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) {
            foreach ($file in $exeFiles) {
              Write-Host "קובץ נוצר בהצלחה: $($file.FullName)"
            }
            Write-Host "מכווץ את כל התיקייה לקובץ ZIP לנוחות הורדה..."
            Compress-Archive -Path "output/*" -DestinationPath "app-release.zip" -Force
            Write-Host "הקובץ app-release.zip נוצר בהצלחה!"
          } else {
            Write-Error "שגיאה: לא נמצא קובץ EXE בתיקיית הפלט."
            exit 1
          }

      - name: Upload EXE Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-v${{ github.event.inputs.app_version }}-Package
          path: |
            output/**/*.exe
            app-release.zip
          retention-days: 7
