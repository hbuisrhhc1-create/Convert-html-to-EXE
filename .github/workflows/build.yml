name: Build EXE

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'שם התוכנה (למשל: MyVault)'
        required: true
        default: 'MyVault'
        type: string
      app_version:
        description: 'גרסת התוכנה (למשל: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      app_description:
        description: 'תיאור קצר לתוכנה'
        required: false
        default: 'אפליקציית שולחן עבודה'
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Prepare icon (png -> ico)
        shell: pwsh
        run: |
          if (Test-Path "icon.png") {
            Write-Host "Converting icon.png -> icon.ico"
            npx --yes png-to-ico icon.png > icon.ico
          }

      - name: Build EXE with Nativefier
        shell: pwsh
        run: |
          if (-not (Test-Path "index.html")) {
            Write-Error "index.html not found in repo root. Aborting."
            exit 1
          }
          $argsList = @(
            "--name", "${{ github.event.inputs.app_name }}",
            "--app-version", "${{ github.event.inputs.app_version }}",
            "--description", "${{ github.event.inputs.app_description }}",
            "--single-instance",
            "--background-color", "#ffffff",
            "--disable-gpu-sandbox",
            "--ignore-certificate-errors",
            "--tray", "false",
            "--platform", "windows",
            "--arch", "x64"
          )
          if (Test-Path "icon.ico") {
            $argsList += "--icon"
            $argsList += "icon.ico"
          }
          Write-Host "Running nativefier..."
          npx --yes nativefier @argsList "index.html" "./output"

      - name: Verify outputs
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path output -Recurse -Filter *.exe -ErrorAction SilentlyContinue
          if ($exe) {
            Write-Host "Build produced EXE successfully!"
          } else {
            Write-Error "No EXE was produced."
            exit 1
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-v${{ github.event.inputs.app_version }}-EXE
          path: output/**/*.exe
          retention-days: 7
