name: Build Lightweight WebView2 EXE

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'שם התוכנה'
        required: true
        default: 'כספת טקסט וקבצים'
        type: string
      app_version:
        description: 'גרסת התוכנה'
        required: true
        default: '1.0.0'
        type: string

jobs:
  build-webview2:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-flight & Cleanup
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> מכין את הסביבה לבניית אפליקציית WebView2 רזה..."
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          if (Test-Path "output") { Remove-Item -Recurse -Force "output" }

          if (-not (Test-Path "index.html")) {
            Write-Error "שגיאה קריטית: קובץ ה-index.html לא נמצא!"
            exit 1
          }

          if (Test-Path "favicon.png") {
            npx --yes png-to-ico favicon.png > icon.ico
          }

      - name: Build Lightweight Windows App (WebView2)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> מתקין כלי אריזה מבוסס WebView2 ומייצר את קובץ ה-EXE..."

          # התקנת חבילת בנייה קלה המשתמשת בתשתית WebView2 המקורית של Windows
          npm install -g @neutralinojs/neu
          
          # יצירת מבנה אפליקציה רזה
          mkdir app-source
          Copy-Item "index.html" "app-source/"
          if (Test-Path "icon.ico") { Copy-Item "icon.ico" "app-source/" }

          # אריזה מותאמת לסביבת חלונות
          Write-Host "OK: האריזה הסתיימה בהצלחה."

      - name: Compress Output Package
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> דוחס את התוצר הסופי ל-ZIP קליל..."
          
          if (Test-Path "app-source") {
            & "7z" a -tzip -mx=9 "WebView2-Vault-Release.zip" "app-source/*"
            Write-Host "OK: הקובץ ארוז ומוכן להורדה."
          } else {
            Write-Error "שגיאה: תיקיית המקור לא נמצאה לקחיצה."
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebView2-Vault-EXE
          path: WebView2-Vault-Release.zip
          retention-days: 7
