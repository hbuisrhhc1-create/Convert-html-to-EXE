name: Universal Dynamic App Builder

on:
  workflow_dispatch:
    inputs:
      target_source:
        description: 'כתובת האתר (URL) או נתיב הקובץ לאריזה (למשל index.html)'
        required: true
        default: 'index.html'
        type: string
      app_name:
        description: 'שם התוכנה'
        required: true
        default: 'UniversalApp'
        type: string
      app_version:
        description: 'גרסת התוכנה'
        required: true
        default: '1.0.0'
        type: string
      include_assets:
        description: 'האם לייצר קובץ ZIP נקי להפצה (חובה אם יש יותר מקובץ אחד)'
        required: true
        default: false
        type: boolean

jobs:
  build-universal:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js (For tools)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-flight & Validate Assets
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> מאמת משאבים..."
          $source = "${{ github.event.inputs.target_source }}"
          
          if ($source -notmatch "^https?://") {
            if (-not (Test-Path $source)) {
              Write-Error "שגיאה קריטית: היעד המקומי '$source' לא נמצא בתיקיית הפרויקט!"
              exit 1
            }
          }
          if (Test-Path "favicon.png") {
            Write-Host ">>> ממיר אייקון בסביבת DOS נקייה למניעת קריסת קידוד..."
            cmd.exe /c "npx --yes png-to-ico favicon.png > icon.ico"
          }

      - name: Compile Ultimate WebView2 EXE
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> יוצר פרויקט C# מקצועי..."

          dotnet new winforms -n UniversalAppProject -o . --force
          dotnet add package Microsoft.Web.WebView2

          # הוספת אייקון ישירות לקובץ ה-EXE עצמו
          if (Test-Path "icon.ico") {
            $csproj = Get-Content UniversalAppProject.csproj -Raw
            $csproj = $csproj -replace '</PropertyGroup>', "<ApplicationIcon>icon.ico</ApplicationIcon>`n  </PropertyGroup>"
            Set-Content UniversalAppProject.csproj -Value $csproj -Encoding UTF8
            Write-Host ">>> האייקון שולב בהצלחה אל תוך מאפייני ה-EXE."
          }

          $appName = "${{ github.event.inputs.app_name }}"
          $source = "${{ github.event.inputs.target_source }}"

          $formCode = @"
          using System;
          using System.IO;
          using System.Windows.Forms;
          using Microsoft.Web.WebView2.Core;

          namespace UniversalAppProject
          {
              static class Program
              {
                  [STAThread]
                  static void Main()
                  {
                      Application.EnableVisualStyles();
                      Application.SetCompatibleTextRenderingDefault(false);
                      Application.Run(new MainForm());
                  }
              }

              public partial class MainForm : Form
              {
                  private Microsoft.Web.WebView2.WinForms.WebView2 webView;

                  public MainForm()
                  {
                      this.Text = "$appName";
                      this.Width = 1024;
                      this.Height = 768;
                      this.StartPosition = FormStartPosition.CenterScreen;
                      
                      webView = new Microsoft.Web.WebView2.WinForms.WebView2();
                      webView.Dock = DockStyle.Fill;
                      this.Controls.Add(webView);
                      
                      InitializeAsync();
                  }

                  private async void InitializeAsync()
                  {
                      try
                      {
                          await webView.EnsureCoreWebView2Async(null);
                          string target = "$source";
                          if (Uri.IsWellFormedUriString(target, UriKind.Absolute)) {
                              webView.CoreWebView2.Navigate(target);
                          } else {
                              // פתרון באג נתיבים באפליקציות חלונות מודרניות - איתור התיקייה הפיזית של ה-EXE
                              string exePath = System.Diagnostics.Process.GetCurrentProcess().MainModule.FileName;
                              string exeDir = Path.GetDirectoryName(exePath);
                              string fullPath = Path.Combine(exeDir, target);
                              webView.CoreWebView2.Navigate(fullPath);
                          }
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show("שגיאה בטעינת המערכת: " + ex.Message, "תקלת הפעלה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                      }
                  }
              }
          }
          "@

          Set-Content -Path "Program.cs" -Value $formCode -Encoding UTF8

          Write-Host ">>> מקמפל לקובץ יחיד, דחוס, ועצמאי בתיקייה ייעודית..."
          # פרסום מדויק הכולל דחיסה, הכללת קבצי מערכת, וניתוב מפורש לתיקיית final_publish
          dotnet publish -c Release -r win-x64 -o ./final_publish --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

          Write-Host ">>> בונה את תיקיית ההפצה הסופית..."
          New-Item -ItemType Directory -Force -Path "build_output"

          $compiledExe = Get-ChildItem -Path "./final_publish" -Filter "*.exe" -File | Select-Object -First 1
          if ($compiledExe) {
            Copy-Item $compiledExe.FullName "build_output/"
            Write-Host "אישור: קובץ ההפעלה נוצר בהצלחה ($($compiledExe.Name))."
          } else {
            Write-Error "שגיאה: כישלון בקומפילציה, לא נוצר קובץ EXE."
            exit 1
          }
          
          if ($source -notmatch "^https?://") {
            if (Test-Path $source) { Copy-Item $source "build_output/" }
          }

      - name: Smart Packaging Strategy
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $includeAssets = "${{ github.event.inputs.include_assets }}"
          $fileCount = (Get-ChildItem -Path "build_output" -File).Count

          if ($includeAssets -eq "true" -or $fileCount -gt 1) {
            Write-Host ">>> המערכת זיהתה צורך במארז ZIP..."
            Compress-Archive -Path "build_output/*" -DestinationPath "UniversalApp-Release.zip" -Force
            Remove-Item "build_output" -Recurse -Force
            New-Item -ItemType Directory -Force -Path "build_output"
            Move-Item "UniversalApp-Release.zip" "build_output/"
          } else {
            Write-Host ">>> הקובץ עומד בפני עצמו, אין צורך בדחיסה כפולה."
          }

      - name: Health Check & Volume Diagnostic
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "================ דו''ח איכות ונפח ================"
          
          $outputFiles = Get-ChildItem -Path "build_output" -Recurse -File
          $totalSize = 0

          foreach ($file in $outputFiles) {
            $sizeMB = [Math]::Round($file.Length / 1MB, 2)
            $totalSize += $file.Length
            Write-Host " - הקובץ $($file.Name) שוקל $sizeMB MB"
          }

          $totalSizeMB = [Math]::Round($totalSize / 1MB, 2)
          Write-Host "----------------------------------------------------"
          Write-Host " משקל כולל של התוצרת: $totalSizeMB MB"
          Write-Host " אישור תקינות: המערכת ביצעה אופטימיזציה ומורשית להפצה."
          Write-Host "===================================================="

      - name: Deploy Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Artifact
          path: build_output/
          retention-days: 7
