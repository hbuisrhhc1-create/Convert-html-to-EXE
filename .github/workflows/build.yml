name: Universal Dynamic App Builder

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'אופציה 1: כתובת אתר מלאה (למשל https://example.com) - השאר ריק כדי להשתמש בקובץ מקומי'
        required: false
        default: ''
        type: string
      local_html_file:
        description: 'אופציה 2: קובץ HTML מקומי (רלוונטי אם כתובת האתר ריקה)'
        required: false
        default: 'index.html'
        type: string
      app_name:
        description: 'שם התוכנה'
        required: true
        default: 'MyWebApp'
        type: string
      app_version:
        description: 'גרסת התוכנה (למשל 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      include_assets:
        description: 'האם לארוז ב-ZIP במידה ויש קבצים מרובים'
        required: true
        default: false
        type: boolean

jobs:
  build-universal:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-flight & Validate Target
        shell: pwsh
        id: config
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          $url = "${{ github.event.inputs.website_url }}".Trim()
          $local = "${{ github.event.inputs.local_html_file }}".Trim()
          
          if (-not [string]::IsNullOrWhiteSpace($url)) {
            $source = $url
            Write-Host ">>> מצב נבחר: כתובת אתר אינטרנט ($source)"
          } else {
            $source = $local
            Write-Host ">>> מצב נבחר: קובץ מקומי ($source)"
            if (-not (Test-Path $source)) {
              Write-Error "שגיאה קריטית: הקובץ המקומי '$source' לא נמצא בפרויקט!"
              exit 1
            }
          }
          
          echo "FINAL_SOURCE=$source" >> $env:GITHUB_ENV
          
          if (Test-Path "favicon.png") {
            Write-Host ">>> ממיר אייקון..."
            cmd.exe /c "npx --yes png-to-ico favicon.png > icon.ico"
          }

      - name: Compile Standalone GUI WebView2 EXE
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host ">>> יוצר פרויקט C#..."

          # יצירת פרויקט WinForms
          dotnet new winforms -n UniversalAppProject -o . --force
          dotnet add package Microsoft.Web.WebView2

          $appVersion = "${{ github.event.inputs.app_version }}"
          $appName = "${{ github.event.inputs.app_name }}"

          # עדכון ה-csproj: ביטול חלון מסוף (WinExe), הטמעת גרסה ואייקון
          $csproj = Get-Content UniversalAppProject.csproj -Raw
          
          # הגדרת סוג הפלט כ-WinExe (חלון גרפי בלבד, ללא קונסולה שחורה)
          if ($csproj -match '<OutputType>Exe</OutputType>') {
              $csproj = $csproj -replace '<OutputType>Exe</OutputType>', '<OutputType>WinExe</OutputType>'
          } else {
              $csproj = $csproj -replace '</PropertyGroup>', "<OutputType>WinExe</OutputType>`n  </PropertyGroup>"
          }

          $versionProps = @"
            <Version>$appVersion</Version>
            <AssemblyVersion>$appVersion</AssemblyVersion>
            <FileVersion>$appVersion</FileVersion>
            <Product>$appName</Product>
            <Company>ינון דרייב</Company>
          "@
          
          $csproj = $csproj -replace '</PropertyGroup>', "$versionProps`n  </PropertyGroup>"
          
          if (Test-Path "icon.ico") {
            $csproj = $csproj -replace '</PropertyGroup>', "<ApplicationIcon>icon.ico</ApplicationIcon>`n  </PropertyGroup>"
          }
          Set-Content UniversalAppProject.csproj -Value $csproj -Encoding UTF8

          $source = $env:FINAL_SOURCE

          # קוד C# מלא עם בדיקה/התקנת WebView2 וטעינת נתיב תקין
          $formCode = @"
          using System;
          using System.IO;
          using System.Windows.Forms;
          using Microsoft.Win32;
          using System.Diagnostics;
          using System.Net;
          using Microsoft.Web.WebView2.Core;

          namespace UniversalAppProject
          {
              static class Program
              {
                  [STAThread]
                  static void Main()
                  {
                      Application.EnableVisualStyles();
                      Application.SetCompatibleTextRenderingDefault(false);
                      Application.Run(new MainForm());
                  }
              }

              public partial class MainForm : Form
              {
                  private Microsoft.Web.WebView2.WinForms.WebView2 webView;

                  public MainForm()
                  {
                      this.Text = "$appName";
                      this.Width = 1024;
                      this.Height = 768;
                      this.StartPosition = FormStartPosition.CenterScreen;
                      
                      if (!IsWebView2RuntimeInstalled())
                      {
                          DialogResult dialogResult = MessageBox.Show(
                              "רכיב המערכת WebView2 (הדרוש להפעלת התוכנה) לא מותקן.\nהאם תרצה שהמערכת תוריד ותתקין אותו כעת באופן אוטומטי?", 
                              "התקנת רכיבים חסרים", 
                              MessageBoxButtons.YesNo, 
                              MessageBoxIcon.Information);
                              
                          if (dialogResult == DialogResult.Yes)
                          {
                              InstallWebView2Runtime();
                          }
                          else
                          {
                              MessageBox.Show("לא ניתן להפעיל את התוכנה ללא רכיב זה.", "שגיאה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                              Environment.Exit(0);
                          }
                      }
                      else
                      {
                          LoadWebView();
                      }
                  }

                  private bool IsWebView2RuntimeInstalled()
                  {
                      try
                      {
                          string version = CoreWebView2Environment.GetAvailableBrowserVersionString();
                          return !string.IsNullOrWhiteSpace(version);
                      }
                      catch (Exception)
                      {
                          return false;
                      }
                  }

                  private void InstallWebView2Runtime()
                  {
                      try
                      {
                          string installerPath = Path.Combine(Path.GetTempPath(), "MicrosoftEdgeWebview2Setup.exe");
                          using (WebClient client = new WebClient())
                          {
                              client.DownloadFile("https://go.microsoft.com/fwlink/p/?LinkId=2124703", installerPath);
                          }
                          
                          Process process = Process.Start(installerPath);
                          process.WaitForExit();
                          
                          if (IsWebView2RuntimeInstalled())
                          {
                              LoadWebView();
                          }
                          else
                          {
                              MessageBox.Show("ההתקנה נכשלה או בוטלה.", "שגיאה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                              Environment.Exit(0);
                          }
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show("שגיאה במהלך ניסיון ההתקנה: " + ex.Message, "שגיאה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                          Environment.Exit(0);
                      }
                  }

                  private async void LoadWebView()
                  {
                      webView = new Microsoft.Web.WebView2.WinForms.WebView2();
                      webView.Dock = DockStyle.Fill;
                      this.Controls.Add(webView);
                      
                      try
                      {
                          await webView.EnsureCoreWebView2Async(null);
                          string target = "$source";

                          if (Uri.IsWellFormedUriString(target, UriKind.Absolute) && target.StartsWith("http", StringComparison.OrdinalIgnoreCase)) {
                              webView.CoreWebView2.Navigate(target);
                          } else {
                              string exePath = System.Diagnostics.Process.GetCurrentProcess().MainModule.FileName;
                              string exeDir = Path.GetDirectoryName(exePath);
                              string fullPath = Path.Combine(exeDir, target);

                              if (File.Exists(fullPath)) {
                                  webView.CoreWebView2.Navigate(new Uri(fullPath).AbsoluteUri);
                              } else {
                                  webView.CoreWebView2.Navigate(new Uri(Path.Combine(AppDomain.CurrentDomain.BaseDirectory, target)).AbsoluteUri);
                              }
                          }
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show("שגיאה בטעינת האפליקציה: " + ex.Message, "שגיאה", MessageBoxButtons.OK, MessageBoxIcon.Error);
                      }
                  }
              }
          }
          "@

          Set-Content -Path "Program.cs" -Value $formCode -Encoding UTF8

          Write-Host ">>> מבצע Publish ל-EXE עצמאי (ללא מסוף שחור)..."
          dotnet publish -c Release -r win-x64 -p:OutputType=WinExe -o ./final_publish --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

          New-Item -ItemType Directory -Force -Path "build_output"

          $compiledExe = Get-ChildItem -Path "./final_publish" -Filter "*.exe" -File | Select-Object -First 1
          if ($compiledExe) {
            Copy-Item $compiledExe.FullName "build_output/"
          } else {
            Write-Error "שגיאה: קובץ ה-EXE לא נוצר."
            exit 1
          }
          
          if ($source -notmatch "^https?://") {
            if (Test-Path $source) { Copy-Item $source "build_output/" }
          }

      - name: Packaging
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $includeAssets = "${{ github.event.inputs.include_assets }}"
          $fileCount = (Get-ChildItem -Path "build_output" -File).Count

          if ($includeAssets -eq "true" -or $fileCount -gt 1) {
            Compress-Archive -Path "build_output/*" -DestinationPath "${{ github.event.inputs.app_name }}.zip" -Force
            Remove-Item "build_output" -Recurse -Force
            New-Item -ItemType Directory -Force -Path "build_output"
            Move-Item "${{ github.event.inputs.app_name }}.zip" "build_output/"
          }

      - name: Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Output
          path: build_output/
          retention-days: 7
