name: Build Windows app or Android APK

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'בחר פלטפורמה ליצירה'
        required: true
        default: Windows
        type: choice
        options:
          - Windows
          - Android

      website_url:
        description: 'כתובת אתר מלאה. השאר ריק כדי להשתמש בקובץ HTML מקומי'
        required: false
        default: 'https://123456-omega-ecru.vercel.app/'
        type: string

      local_html_file:
        description: 'נתיב לקובץ HTML במאגר, למשל index.html'
        required: false
        default: index.html
        type: string

      app_name:
        description: 'שם האפליקציה'
        required: true
        default: 'כספת טקסט וקבצים'
        type: string

      app_version:
        description: 'גרסה, למשל 1.0.0'
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      TARGET_PLATFORM: ${{ inputs.target_platform }}
      WEBSITE_URL: ${{ inputs.website_url }}
      LOCAL_HTML: ${{ inputs.local_html_file }}
      APP_NAME: ${{ inputs.app_name }}
      APP_VERSION: ${{ inputs.app_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          foreach ($value in @($env:APP_NAME, $env:APP_VERSION, $env:WEBSITE_URL, $env:LOCAL_HTML)) {
            if ($null -ne $value -and $value.Contains("`n")) {
              throw 'הקלטים לא יכולים להכיל שורות חדשות.'
            }
            if ($null -ne $value -and $value.Contains("`r")) {
              throw 'הקלטים לא יכולים להכיל שורות חדשות.'
            }
          }

          $appName = $env:APP_NAME.Trim()
          if ([string]::IsNullOrWhiteSpace($appName)) {
            throw 'חובה לספק שם לאפליקציה.'
          }

          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+([\-+][0-9A-Za-z.-]+)?$') {
            throw 'גרסה לא תקינה. יש להשתמש בתבנית כמו 1.0.0.'
          }

          $safeFileName = ($appName -replace '[<>:"/\\|?*]', '').Trim().TrimEnd('.')
          if ([string]::IsNullOrWhiteSpace($safeFileName)) {
            $safeFileName = 'BuiltApp'
          }

          "SAFE_FILE_NAME=$safeFileName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $url = $env:WEBSITE_URL.Trim()
          if (-not [string]::IsNullOrWhiteSpace($url)) {
            $parsedUrl = $null
            if (-not [Uri]::TryCreate($url, [UriKind]::Absolute, [ref]$parsedUrl)) {
              throw 'כתובת האתר אינה תקינה.'
            }
            if ($parsedUrl.Scheme -notin @('http', 'https')) {
              throw 'כתובת האתר חייבת להתחיל ב-http:// או ב-https://.'
            }

            "FINAL_SOURCE=$url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'IS_URL=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          else {
            $local = $env:LOCAL_HTML.Trim()
            if ([string]::IsNullOrWhiteSpace($local)) {
              $local = 'index.html'
            }

            $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
            $fullPath = [IO.Path]::GetFullPath((Join-Path $workspace $local))
            $workspacePrefix = $workspace.TrimEnd('\') + '\'

            if (-not $fullPath.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'קובץ ה-HTML חייב להיות בתוך המאגר.'
            }
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
              throw "קובץ HTML מקומי לא נמצא: $local"
            }

            $relativePath = [IO.Path]::GetRelativePath($workspace, $fullPath)
            "FINAL_SOURCE=$relativePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'IS_URL=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      # ----------------------------
      # Windows EXE
      # ----------------------------

      - name: Setup .NET
        if: ${{ inputs.target_platform == 'Windows' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Windows EXE
        if: ${{ inputs.target_platform == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $workspace = $env:GITHUB_WORKSPACE
          $projectDir = Join-Path $workspace 'src_win\AppHost'
          $outputDir = Join-Path $workspace 'build_output'

          if (Test-Path (Join-Path $workspace 'src_win')) {
            Remove-Item (Join-Path $workspace 'src_win') -Recurse -Force
          }
          if (Test-Path $outputDir) {
            Remove-Item $outputDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          dotnet new winforms --name AppHost --output $projectDir --framework net8.0 --force
          Set-Location $projectDir
          dotnet add package Microsoft.Web.WebView2

          $appNameBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:APP_NAME))
          $sourceBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:FINAL_SOURCE))
          $isUrl = $env:IS_URL.ToLowerInvariant()

          $programCode = @'
          using System;
          using System.IO;
          using System.Text;
          using System.Windows.Forms;
          using Microsoft.Web.WebView2.Core;

          namespace AppHost
          {
              internal static class Program
              {
                  [STAThread]
                  private static void Main()
                  {
                      Application.EnableVisualStyles();
                      Application.SetCompatibleTextRenderingDefault(false);

                      string appName = Encoding.UTF8.GetString(Convert.FromBase64String("__APP_NAME_BASE64__"));
                      Application.Run(new MainForm(appName));
                  }
              }

              internal sealed class MainForm : Form
              {
                  private readonly string appName;
                  private readonly Microsoft.Web.WebView2.WinForms.WebView2 webView;

                  public MainForm(string name)
                  {
                      appName = name;
                      Text = appName;
                      Width = 1200;
                      Height = 800;
                      StartPosition = FormStartPosition.CenterScreen;

                      webView = new Microsoft.Web.WebView2.WinForms.WebView2
                      {
                          Dock = DockStyle.Fill
                      };
                      Controls.Add(webView);

                      Shown += async (_, _) => await LoadWebPageAsync();
                  }

                  private async System.Threading.Tasks.Task LoadWebPageAsync()
                  {
                      try
                      {
                          string userDataFolder = Path.Combine(
                              Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                              "AppHostWebView2");

                          var environment = await CoreWebView2Environment.CreateAsync(null, userDataFolder);
                          await webView.EnsureCoreWebView2Async(environment);

                          string target = Encoding.UTF8.GetString(
                              Convert.FromBase64String("__SOURCE_BASE64__"));

                          if ("__IS_URL__" == "true")
                          {
                              webView.CoreWebView2.Navigate(target);
                          }
                          else
                          {
                              string siteDirectory = Path.Combine(AppContext.BaseDirectory, "site");
                              webView.CoreWebView2.SetVirtualHostNameToFolderMapping(
                                  "app.local",
                                  siteDirectory,
                                  CoreWebView2HostResourceAccessKind.Allow);

                              string relativePath = target.Replace('\\', '/');
                              webView.CoreWebView2.Navigate("https://app.local/" + relativePath);
                          }
                      }
                      catch (Exception ex)
                      {
                          MessageBox.Show(
                              "שגיאה בטעינת האפליקציה: " + ex.Message,
                              "שגיאה",
                              MessageBoxButtons.OK,
                              MessageBoxIcon.Error);
                      }
                  }
              }
          }
          '@

          $programCode = $programCode.Replace('__APP_NAME_BASE64__', $appNameBase64)
          $programCode = $programCode.Replace('__SOURCE_BASE64__', $sourceBase64)
          $programCode = $programCode.Replace('__IS_URL__', $isUrl)
          Set-Content -Path (Join-Path $projectDir 'Program.cs') -Value $programCode -Encoding utf8

          $publishDir = Join-Path $projectDir 'publish'
          $csproj = Get-ChildItem -Path $projectDir -Filter '*.csproj' | Select-Object -First 1
          if (-not $csproj) {
            throw 'לא נמצא קובץ פרויקט csproj.'
          }

          dotnet publish $csproj.FullName `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:UseAppHost=true `
            --output $publishDir

          if ($env:IS_URL -eq 'false') {
            $sourcePath = Join-Path $workspace $env:FINAL_SOURCE
            $sourceDirectory = Split-Path -Parent $sourcePath
            $siteDirectory = Join-Path $publishDir 'site'
            New-Item -ItemType Directory -Force -Path $siteDirectory | Out-Null

            $excludedNames = @('.git', '.github', 'src_win', 'android_app', 'build_output', 'node_modules')
            Get-ChildItem -LiteralPath $sourceDirectory -Force |
              Where-Object { $_.Name -notin $excludedNames } |
              Copy-Item -Destination $siteDirectory -Recurse -Force
          }

          $exe = Get-ChildItem -Path $publishDir -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) {
            throw 'לא נוצר קובץ EXE.'
          }

          Copy-Item -Path $exe.FullName `
            -Destination (Join-Path $outputDir ($env:SAFE_FILE_NAME + '.exe')) `
            -Force

      # ----------------------------
      # Android APK
      # ----------------------------

      - name: Setup Java
        if: ${{ inputs.target_platform == 'Android' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        if: ${{ inputs.target_platform == 'Android' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        if: ${{ inputs.target_platform == 'Android' }}
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: ${{ inputs.target_platform == 'Android' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build Android APK
        if: ${{ inputs.target_platform == 'Android' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $workspace = $env:GITHUB_WORKSPACE
          $appDir = Join-Path $workspace 'android_app'
          $outputDir = Join-Path $workspace 'build_output'

          if (Test-Path $appDir) {
            Remove-Item $appDir -Recurse -Force
          }
          if (Test-Path $outputDir) {
            Remove-Item $outputDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          npm install --global cordova
          cordova create $appDir com.universal.app 'AppTempName'

          Set-Location $appDir
          cordova platform add android@13.0.0

          $configPath = Join-Path $appDir 'config.xml'
          [xml]$config = Get-Content -LiteralPath $configPath -Raw
          $contentNode = $config.SelectSingleNode("//*[local-name()='content']")
          if (-not $contentNode) {
            throw 'לא נמצא רכיב content ב-config.xml.'
          }

          if ($env:IS_URL -eq 'true') {
            $url = [Uri]$env:FINAL_SOURCE
            $contentNode.SetAttribute('src', $env:FINAL_SOURCE)

            $namespace = $config.DocumentElement.NamespaceURI
            $accessNode = $config.CreateElement('access', $namespace)
            $accessNode.SetAttribute('origin', $url.GetLeftPart([UriPartial]::Authority))
            $config.DocumentElement.AppendChild($accessNode) | Out-Null

            $navigationNode = $config.CreateElement('allow-navigation', $namespace)
            $navigationNode.SetAttribute('href', $url.GetLeftPart([UriPartial]::Authority) + '/*')
            $config.DocumentElement.AppendChild($navigationNode) | Out-Null
          }
          else {
            $sourcePath = Join-Path $workspace $env:FINAL_SOURCE
            $sourceDirectory = Split-Path -Parent $sourcePath
            $contentNode.SetAttribute('src', (Split-Path -Leaf $sourcePath))

            $wwwDirectory = Join-Path $appDir 'www'
            if (Test-Path $wwwDirectory) {
              Remove-Item $wwwDirectory -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $wwwDirectory | Out-Null

            $excludedNames = @('.git', '.github', 'src_win', 'android_app', 'build_output', 'node_modules')
            Get-ChildItem -LiteralPath $sourceDirectory -Force |
              Where-Object { $_.Name -notin $excludedNames } |
              Copy-Item -Destination $wwwDirectory -Recurse -Force
          }

          $nameNode = $config.SelectSingleNode("//*[local-name()='name']")
          if ($nameNode) {
            $nameNode.InnerText = $env:APP_NAME
          }

          $config.Save($configPath)

          cordova build android --debug

          $apk = Get-ChildItem `
            -Path (Join-Path $appDir 'platforms/android/app/build/outputs/apk/debug') `
            -Filter '*.apk' -File |
            Select-Object -First 1

          if (-not $apk) {
            throw 'לא נוצר קובץ APK.'
          }

          Copy-Item -Path $apk.FullName `
            -Destination (Join-Path $outputDir ($env:SAFE_FILE_NAME + '.apk')) `
            -Force

      - name: Check build output
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'build_output'
          $files = @(Get-ChildItem -Path $outputDir -File)

          if ($files.Count -eq 0) {
            throw 'תהליך הבנייה הסתיים בלי קובץ פלט.'
          }

          foreach ($file in $files) {
            Write-Host "נוצר קובץ: $($file.FullName)"
          }

      - name: Generate build summary
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'build_output'
          $builtFile = Get-ChildItem -Path $outputDir -File | Select-Object -First 1

          $summary = @"
          ### דוח בנייה
          | פרמטר | ערך |
          | :--- | :--- |
          | שם האפליקציה | $($env:APP_NAME) |
          | גרסה | $($env:APP_VERSION) |
          | פלטפורמה | $($env:TARGET_PLATFORM) |
          | קובץ | $($builtFile.Name) |
          | סטטוס | הצלחה |
          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Create GitHub Release and upload file
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*
          tag_name: v${{ inputs.app_version }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          name: '${{ inputs.app_name }} v${{ inputs.app_version }} (${{ inputs.target_platform }})'
          body: |
            קובץ האפליקציה נבנה בהצלחה.
          draft: false
          prerelease: false
